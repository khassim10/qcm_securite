certaines attaques visant les protocoles", "B": "Masquer les pages d’erreur HTTP et supprimer les en-têtes d’identification du serveur", "C": "Remplacer l’authentification des utilisateurs", "D": "Détecter et bloquer certaines attaques visant un serveur ou une application", "E": "Chiffrer les données au repos des serveurs"}}, {"id": 479, "module": 9, "question": "Un hôpital veut que les équipements biomédicaux, les postes administratifs et le Wi-Fi invité partagent les mêmes commutateurs sans pouvoir communiquer librement entre eux. Quelle technologie est adaptée ?", "choix": {"A": "Un proxy direct", "B": "Un pot de miel", "C": "Une passerelle NAT", "D": "Un tunnel complet VPN", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 480, "module": 9, "question": "Concernant les apports de sécurité d’un serveur proxy, quelles affirmations sont exactes ?", "choix": {"A": "Il chiffre automatiquement le disque des postes clients", "B": "Il peut masquer les adresses IP des terminaux internes", "C": "Il peut intercepter un malware avant qu’il n’atteigne le terminal interne", "D": "Il empêche toute fuite de données par courriel", "E": "Il remplace le besoin d’antivirus sur les postes"}}, {"id": 481, "module": 9, "question": "Un commerçant en ligne remplace chaque numéro de carte stocké dans ses systèmes par une chaîne aléatoire sans lien mathématique avec le numéro réel ; les numéros originaux sont conservés dans une base séparée et protégée. Quelle technique est utilisée ?", "choix": {"A": "Le hachage des numéros", "B": "Le chiffrement asymétrique des numéros", "C": "Le masquage par split tunnel", "D": "La stéganographie des numéros", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 482, "module": 9, "question": "Lors d’un incident, l’équipe perd deux heures à identifier quel équipement porte le nom « SRV-X12 » et à quel réseau appartient l’adresse 10.4.7.22. Quels outils de gestion de configuration auraient évité ce retard ?", "choix": {"A": "Des conventions de nommage standardisées", "B": "Un équilibrage de charge actif-actif", "C": "Un filtrage d’URL plus strict", "D": "Un schéma d’adressage IP défini et des diagrammes à jour", "E": "Un pot de miel supplémentaire"}}, {"id": 483, "module": 9, "question": "Une entreprise veut confier le chiffrement TLS de ses sites à un équipement central plutôt qu’à chaque serveur, tout en gardant la maîtrise des clés dans un matériel protégé. Parmi les combinaisons suivantes, laquelle est la plus cohérente ?", "choix": {"A": "Un TAP terminant TLS, avec les clés dans le DLP", "B": "Un pot de miel terminant TLS, avec les clés stockées dans un VLAN invité isolé", "C": "Un proxy inverse terminant TLS, avec les clés protégées par un HSM réseau", "D": "Un proxy direct terminant TLS, avec les clés stockées en clair sur chaque poste client", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 484, "module": 9, "question": "Pour administrer les serveurs de la DMZ, les administrateurs doivent d’abord se connecter à un serveur minimaliste, fortement contrôlé, qui fait le lien entre le réseau interne et la DMZ. Quel dispositif est utilisé ?", "choix": {"A": "Un proxy direct d’administration", "B": "Un serveur de rebond (jump box)", "C": "Une passerelle NAT entre les deux zones", "D": "Un équilibreur de charge entre zones", "E": "Un pot de miel"}}, {"id": 485, "module": 9, "question": "Une équipe veut que tous ses équilibreurs de charge traitent le trafic en permanence afin de maximiser la capacité disponible. Quelle configuration est adaptée ?", "choix": {"A": "Actif-actif", "B": "Split tunnel", "C": "Actif-passif", "D": "Persistance de session désactivée", "E": "Hors bande"}}, {"id": 486, "module": 9, "question": "Les postes infectés d’un réseau tentent de joindre un domaine de commande et de contrôle. Le DNS interne est configuré pour renvoyer ces requêtes vers un serveur contrôlé par l’équipe de sécurité, qui les journalise. Quelle technique est mise en œuvre ?", "choix": {"A": "Un pot de miel à faible interaction", "B": "Un équilibrage de charge", "C": "Un gouffre (sinkhole)", "D": "Une traduction d’adresses", "E": "Un proxy inverse"}}, {"id": 487, "module": 9, "question": "Une entreprise utilise des adresses privées en interne et une seule adresse publique pour l’accès Internet. Quel équipement permet ce fonctionnement ?", "choix": {"A": "Un TAP", "B": "Un WAF", "C": "Un pot de miel", "D": "Un HSM réseau", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 488, "module": 9, "question": "Deux agences d’une banque, à Lomé et à Kara, doivent échanger en permanence via Internet comme si elles étaient sur le même réseau privé, sans action des utilisateurs. Quel type de VPN est adapté ?", "choix": {"A": "Un proxy direct", "B": "Un tunnel partagé côté client", "C": "Un NAC", "D": "Un VPN site à site", "E": "Un VPN d’accès distant"}}, {"id": 489, "module": 9, "question": "Quels sont les protocoles les plus courants pour les VPN ?", "choix": {"A": "SSL/TLS", "B": "IPsec", "C": "S/MIME", "D": "STP", "E": "SRTP"}}, {"id": 490, "module": 9, "question": "Les sondes de détection d’un opérateur sont administrées via un réseau dédié, physiquement séparé du réseau de production qu’elles surveillent. Quel mode de gestion est utilisé, et quel est son intérêt ?", "choix": {"A": "La gestion dans la bande, qui réduit le coût", "B": "La gestion hors bande, qui supprime le besoin d’authentifier les administrateurs", "C": "La gestion hors bande, qui reste accessible si le réseau surveillé tombe", "D": "La gestion par proxy inverse, qui masque les sondes", "E": "La gestion dans la bande, qui protège les sondes contre les attaques réseau directes"}}, {"id": 491, "module": 9, "question": "Une ACL de routeur se termine par une règle implicite de refus. Un administrateur ajoute une règle autorisant le trafic web, mais oublie le trafic DNS. Quelle conséquence est la plus probable ?", "choix": {"A": "Le routeur ignore la règle web", "B": "Le trafic DNS est autorisé par défaut", "C": "Aucune conséquence, le DNS n’utilisant pas le réseau filtré par le routeur", "D": "La résolution des noms échoue et la navigation devient impossible", "E": "Le trafic web est bloqué, alors que le trafic DNS reste autorisé par défaut"}}, {"id": 492, "module": 9, "question": "Des commerciaux en déplacement doivent accéder de façon sécurisée aux applications internes depuis des réseaux publics. Quel type de VPN est adapté ?", "choix": {"A": "Un proxy inverse", "B": "Un VPN d’accès distant", "C": "Un honeynet", "D": "Un pare-feu sans état", "E": "Un VPN site à site"}}, {"id": 493, "module": 9, "question": "Un attaquant a compromis un serveur de la DMZ. Quelle architecture limite le mieux sa progression vers le réseau interne ?", "choix": {"A": "Un équilibreur de charge en round-robin", "B": "Un split tunnel pour les serveurs de la DMZ", "C": "Un seul pare-feu autorisant tout le trafic de la DMZ vers le réseau interne", "D": "Un pot de miel placé dans le réseau interne", "E": "Une DMZ entre deux pare-feu, avec des flux internes strictement limités"}}, {"id": 494, "module": 9, "question": "Quelles affirmations sur les catégories de pare-feu sont exactes ?", "choix": {"A": "Un pare-feu à états tient compte de l’état de la connexion en plus des règles", "B": "Un pare-feu sans état suit l’historique complet de chaque session", "C": "Un pare-feu peut être installé sur un hôte, sous forme d’appliance ou sous forme virtuelle", "D": "Un pare-feu logiciel ne peut jamais filtrer le trafic sortant", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 495, "module": 9, "question": "Un portail de télédéclaration reçoit des requêtes contenant des tentatives d’injection SQL et de XSS. Le pare-feu réseau laisse passer ce trafic car il utilise le port 443 autorisé. Quel équipement est le plus adapté pour filtrer ces attaques ?", "choix": {"A": "Un TAP réseau", "B": "Une passerelle NAT", "C": "Un pot de miel à faible interaction", "D": "Un pare-feu applicatif web (WAF)", "E": "Un pare-feu sans état supplémentaire"}}, {"id": 496, "module": 9, "question": "Après une infection propagée depuis un poste de télétravail, la DSI veut que tout le trafic des postes nomades soit inspecté par les équipements centraux. Quelle configuration VPN doit-elle adopter, et quel coût en découle ?", "choix": {"A": "Un tunnel partagé, qui réduit la charge du concentrateur VPN installé au siège", "B": "Un tunnel complet, qui accroît la charge et la bande passante au siège", "C": "Un VPN site à site, qui supprime le besoin d’authentification des utilisateurs nomades", "D": "Aucun VPN, en s’appuyant sur le filtrage d’URL local", "E": "Un tunnel partagé, qui renforce l’inspection centrale"}}, {"id": 497, "module": 9, "question": "Après plusieurs incidents liés à des pare-feu configurés différemment selon les sites, la DSI veut un point de référence commun pour tous les équipements. Quel outil est adapté ?", "choix": {"A": "Un proxy inverse centralisé pour tous les sites", "B": "Un pot de miel de référence déployé sur chaque site", "C": "Une configuration de référence sécurisée", "D": "Une politique de split tunnel commune à tous les sites", "E": "Un sinkhole DNS"}}, {"id": 498, "module": 9, "question": "Un serveur de fichiers doit permettre au service RH de lire et modifier le dossier « Paie », au service comptable de le lire seulement, et refuser tout accès aux autres. Quel mécanisme est adapté ?", "choix": {"A": "Un pot de miel", "B": "Une ACL réseau sur le routeur Internet", "C": "Un proxy inverse devant le serveur de fichiers", "D": "Une ACL du système de fichiers", "E": "Un équilibreur de charge applicatif"}}, {"id": 499, "module": 9, "question": "Un établissement déploie plusieurs systèmes leurres interconnectés, comportant des vulnérabilités volontaires, simulant un réseau complet. Comment s’appelle ce dispositif ?", "choix": {"A": "Un UTM", "B": "Un TAP", "C": "Une DMZ", "D": "Un sinkhole", "E": "Un honeynet"}}, {"id": 500, "module": 9, "question": "Une équipe raccorde son système de détection à un port du commutateur qui reçoit une copie du trafic. Quelles conséquences en découlent ?", "choix": {"A": "Le système est passif et ne peut pas bloquer directement le trafic", "B": "Une panne du système n’interrompt pas le trafic de production", "C": "Le système ne peut analyser aucune attaque", "D": "Le système ajoute une latence importante à toutes les communications", "E": "Aucune des propositions ci-dessus n’est exacte."}}]};
const ANSWERS_BUILTIN = {"1": {"r": "A", "e": "L’anecdote drôle sert à détendre l’interlocuteur et à créer de la sympathie pour obtenir une information : c’est le principe « faire rire la victime »."}, "2": {"r": "B", "e": "Un durcissement excessif pousse les usagers à contourner les règles (post-it). La politique technique est efficace sur le papier mais annulée en partie par le facteur humain."}, "3": {"r": "E", "e": "C’est une attaque de la chaîne d’approvisionnement (supply chain) : la porte dérobée est insérée chez l’éditeur. Aucun des vecteurs proposés ne correspond."}, "4": {"r": "C", "e": "Ce qui distingue un white hat est l’autorisation préalable de tester. Ni l’employeur, ni les outils, ni les certifications ne suffisent."}, "5": {"r": "BD", "e": "L’appel téléphonique est du vishing, et le faux technicien usurpe un rôle (impersonation). Ce n’est pas du smishing : l’attaque passe par la voix, le SMS n’est que le code légitime."}, "6": {"r": "C", "e": "Une donnée de dosage modifiée par erreur est une atteinte à l’intégrité. La confidentialité et la disponibilité sont préservées."}, "7": {"r": "D", "e": "Les données sont détruites sans être copiées ni divulguées : c’est une perte de données (data loss), pas une exfiltration."}, "8": {"r": "A", "e": "Un routeur exposé sur Internet avec un mot de passe par défaut est trivial à exploiter : c’est le risque le plus exposé, donc la priorité."}, "9": {"r": "E", "e": "Un faux avertissement de virus qui pousse à supprimer un fichier légitime est un hoax. Le dommage vient de l’utilisateur lui-même."}, "10": {"r": "B", "e": "L’enchaînement logique : la disponibilité tombe, puis la productivité et les finances en pâtissent, puis la réputation est atteinte."}, "11": {"r": "CE", "e": "L’annuaire donne les noms et numéros à cibler ou imiter, l’organigramme désigne les personnes d’autorité à usurper. Le manuel système ne sert pas directement à l’usurpation."}, "12": {"r": "A", "e": "Le shadow IT et la menace interne malveillante produisent le même trafic : seule l’intention (contourner une contrainte ou nuire) les distingue."}, "13": {"r": "D", "e": "Le lecteur PDF tiers en retard de versions est un logiciel applicatif peu corrigé, alors que l’OS est bien patché."}, "14": {"r": "E", "e": "Aucune donnée n’est touchée ni indisponible : l’effet est une atteinte à la réputation, absente des propositions."}, "15": {"r": "C", "e": "L’attaquant a un accès physique direct à la machine. La clé USB n’est que l’outil, le vecteur est l’accès direct au matériel."}, "16": {"r": "B", "e": "Le critère discriminant d’un hacktiviste est la motivation idéologique, liée ici à une décision politique. L’absence de rançon et le kit public ne suffisent pas à trancher."}, "17": {"r": "AD", "e": "En mémoire vive, l’information est en cours de traitement par le processeur, un état que le chiffrement du disque et du réseau ne couvre pas."}, "18": {"r": "BC", "e": "La curiosité est le levier d’ingénierie sociale et la clé USB est le support amovible. Ce n’est ni de la chaîne d’approvisionnement ni un point d’eau, et le vecteur n’est pas l’accès direct."}, "19": {"r": "D", "e": "Une bande de sauvegarde est de l’information stockée sur un support (données au repos), même pendant le transport physique."}, "20": {"r": "A", "e": "Quand on ne peut ni patcher ni migrer, on isole : segmentation réseau et flux strictement limités. Un antivirus XP ou des correctifs non officiels sont inadaptés."}, "21": {"r": "BCE", "e": "Un zero-day est exploitable avant que l’éditeur le connaisse, sans signature ni correctif, et il est jugé très grave. Il n’est pas réservé aux États."}, "22": {"r": "AD", "e": "L’ingénierie sociale exploite l’humain plutôt que la technique, et beaucoup de techniques (talonnage, vishing, shoulder surfing) ne passent pas par la messagerie."}, "23": {"r": "C", "e": "La cause est un processus d’achat trop lent qui pousse au shadow IT. Sanctions, DLP ou sensibilisation ne traitent que le symptôme."}, "24": {"r": "B", "e": "Utiliser des identités volées pour ouvrir des lignes et des comptes est une usurpation d’identité."}, "25": {"r": "E", "e": "Sans autorisation mais sans intention malveillante déclarée : c’est la définition du gray hat."}, "26": {"r": "C", "e": "Un site fréquenté par un groupe ciblé, compromis à l’avance et sans courriel : c’est un point d’eau (watering hole)."}, "27": {"r": "D", "e": "Une arnaque par SMS est du smishing. Le message de masse n’est pas du spear phishing."}, "28": {"r": "A", "e": "Les risques liés aux fournisseurs relèvent de la gestion des fournisseurs (vendor management) : on ne s’en décharge pas."}, "29": {"r": "B", "e": "Outil par défaut, tutoriel suivi à la lettre et abandon au premier échec : profil typique du script kiddie."}, "30": {"r": "AC", "e": "Il fournit une raison (l’auditeur arrive) et projette de l’assurance (jargon, aplomb)."}, "31": {"r": "E", "e": "Aucune des étiquettes ne convient : pas de lien, pas de faux site, pas de domaine imité. C’est de l’ingénierie sociale par courriel."}, "32": {"r": "D", "e": "Les plaintes, les questions personnelles et les toilettes détournent l’attention de la demande de badge : évitement et diversion."}, "33": {"r": "B", "e": "Le correctif était public : l’exploit a profité du délai d’application. Un zero-day suppose l’absence de correctif."}, "34": {"r": "C", "e": "L’approche initiale est faite par un profil professionnel sur un réseau social : le vecteur est les réseaux sociaux."}, "35": {"r": "E", "e": "La compromission passe par un tiers connecté : c’est le risque d’intégration système avec un tiers."}, "36": {"r": "B", "e": "Dans le cloud, la sécurité est partagée : le client reste responsable de la configuration de ses ressources."}, "37": {"r": "D", "e": "Le correctif existe mais il est difficile à déployer sur le firmware : c’est une vulnérabilité liée à la difficulté de patcher."}, "38": {"r": "ABC", "e": "Les attaques internes sont plus difficiles à repérer, les APT sont associées aux États et les courtiers vendent la faille au plus offrant. Les script kiddies restent dangereux."}, "39": {"r": "E", "e": "Des comptes récents qui diffusent des messages coordonnés avec de faux articles : campagne d’influence."}, "40": {"r": "D", "e": "La bonne adresse mène à une copie du site sans lien cliqué ni faute de frappe : c’est du pharming (résolution DNS détournée)."}, "41": {"r": "C", "e": "C’est du shoulder surfing : on le contre en masquant le clavier et en éloignant la file. Un changement mensuel du code ou un sas n’empêchent pas l’observation."}, "42": {"r": "A", "e": "Des commanditaires peu nombreux qui financent, recrutent et prélèvent une commission sans participer aux fraudes : syndicat criminel organisé comme une entreprise."}, "43": {"r": "E", "e": "Un message frauduleux est passé : faux négatif. La cause est que le filtre analyse du texte alors que le contenu est une image."}, "44": {"r": "AB", "e": "Un employé quitte avec la liste clients : menace interne dont l’impact est l’exfiltration. La base n’est pas détruite (pas de perte), et ce n’est pas du shadow IT car il y a intention."}, "45": {"r": "C", "e": "Le pharming détourne la résolution de nom (DNS). Ici l’attaquant mise sur la faute de frappe : c’est du typosquatting."}, "46": {"r": "D", "e": "Sans formulaire, l’objectif est de monétiser le trafic par la publicité : typosquatting classique."}, "47": {"r": "BC", "e": "Il vend la faille au plus offrant (courtier) et, exploitée avant que la banque la connaisse, c’est un zero-day. Ce n’est ni un white hat ni forcément un acteur étatique."}, "48": {"r": "E", "e": "Logiciel sur mesure, 26 mois de présence, exfiltration discrète et aucune revente : campagne d’espionnage de type APT, typique d’un acteur étatique."}, "49": {"r": "A", "e": "Le directeur financier est une cible de haut niveau et le message est très personnalisé : c’est du whaling."}, "50": {"r": "D", "e": "Coupures en série, messages de menace et aucun vol de données : le but est la perturbation et la panique, donc du cyberterrorisme."}, "51": {"r": "E", "e": "Les produits ont tenu, c’est un humain qui a été manipulé : la couche « personnes » a cédé."}, "52": {"r": "C", "e": "L’exfiltration est une forme de violation de données, mais une violation peut exister sans exfiltration (accès, divulgation accidentelle)."}, "53": {"r": "AB", "e": "Des liens frauduleux par messagerie instantanée sont du spim, et une passerelle qui ne couvre pas ce canal ne prouve pas l’absence d’attaque."}, "54": {"r": "D", "e": "Le fournisseur n’a pas été piraté : les permissions ouvertes sont une configuration faible côté client (modèle de responsabilité partagée)."}, "55": {"r": "C", "e": "Un faux point d’accès Wi-Fi se faisant passer pour le réseau invité est un vecteur sans-fil (evil twin)."}, "56": {"r": "B", "e": "Le dossier est inaccessible sans fuite ni altération : c’est la disponibilité qui est visée."}, "57": {"r": "E", "e": "Trois personnes sont entrées pour une seule entrée journalisée : le contrôle d’accès a laissé passer sans le détecter (faux négatif), par talonnage."}, "58": {"r": "D", "e": "La note donne le nom du prestataire, la date et le contexte : de quoi construire un prétexte crédible pour une usurpation."}, "59": {"r": "C", "e": "Chercher des informations indexées publiquement s’apparente à du dumpster diving électronique (Google dorking). Il n’interroge pas directement le site."}, "60": {"r": "E", "e": "Un SMS de masse sur des cibles au hasard est du smishing. Ce n’est ni du whaling ni du spear phishing."}, "61": {"r": "AB", "e": "L’IA adverse consiste à attaquer les algorithmes ou à empoisonner leurs données d’entraînement pour faire ignorer des attaques."}, "62": {"r": "E", "e": "Utiliser un objet non initialisé est une déréférence de pointeur nul, qui n’apparaît pas dans les propositions."}, "63": {"r": "C", "e": "Il réside en mémoire et utilise des processus natifs légitimes : peu d’artefacts fichiers à analyser."}, "64": {"r": "A", "e": "Un champ non validé utilisé directement est une gestion incorrecte des entrées (improper input handling)."}, "65": {"r": "D", "e": "L’empoisonnement des données d’entraînement apprend au moteur à laisser passer ces variantes : faux négatifs ciblés."}, "66": {"r": "B", "e": "Un rootkit contrôle l’OS et peut falsifier ce que les outils voient. Depuis un démarrage externe, l’OS compromis n’est pas actif."}, "67": {"r": "C", "e": "C’est une attaque par rejeu : on la contre avec des éléments non réutilisables (nonce, horodatage, jeton à usage unique)."}, "68": {"r": "AD", "e": "Le CSRF abuse des droits de l’utilisateur authentifié, le SSRF exploite la confiance entre serveurs. Le SSRF ne demande pas de clic de la victime."}, "69": {"r": "B", "e": "Fichiers chiffrés contre rançon : cryptomalware (ransomware), catégorie « emprisonner »."}, "70": {"r": "CE", "e": "Les vers modernes peuvent déposer une charge comme un virus (ici une porte dérobée), ce qui permet le contrôle à distance. Aucune pièce jointe n’est nécessaire."}, "71": {"r": "A", "e": "Un bot se reconnaît à la réception d’instructions depuis un serveur de commande et de contrôle. Un ransomware chiffrerait des fichiers, un spyware se concentrerait sur la collecte."}, "72": {"r": "B", "e": "Le cheval de Troie se déguise en programme légitime, alors que le ver se propage seul par le réseau."}, "73": {"r": "D", "e": "Un virus de fichier se réplique en infectant d’autres fichiers, y compris sur une machine isolée. La propagation réseau est la marque du ver."}, "74": {"r": "C", "e": "HTTPS protège le transport, mais l’injection SQL abuse du traitement des entrées côté serveur : les requêtes malveillantes arrivent chiffrées puis déchiffrées."}, "75": {"r": "E", "e": "Il faut d’abord stopper la propagation : isoler le segment touché. Le reste (nettoyage, restauration) vient ensuite."}, "76": {"r": "D", "e": "Un keylogger lit les frappes avant leur chiffrement : HTTPS ne protège pas contre une compromission du poste."}, "77": {"r": "AC", "e": "Un adaptateur matériel entre clavier et USB peut être un keylogger matériel, qu’un antivirus ne détecte pas car il n’y a pas de logiciel."}, "78": {"r": "BE", "e": "Les postes sont des bots (zombies) qui interrogent régulièrement un serveur de commande et de contrôle (C2)."}, "79": {"r": "AD", "e": "Les deux dépassent ce que le programmeur avait prévu en mémoire ou en valeur, et la vérification des limites et des entrées réduit les risques."}, "80": {"r": "BCE", "e": "Valider les entrées, utiliser des requêtes paramétrées et afficher des erreurs génériques évitent l’injection et la fuite d’informations. HTTPS et le chiffrement du disque n’y changent rien."}, "81": {"r": "A", "e": "Le modèle lui-même a été modifié pour ignorer une famille de malware : compromission de l’algorithme. Contaminer les données d’entraînement serait un autre scénario."}, "82": {"r": "BCD", "e": "Authentifier et autoriser les appels, valider les données reçues et journaliser les usages réduisent le risque. Désactiver la journalisation l’augmente."}, "83": {"r": "AE", "e": "Protéger l’intégrité et la provenance des données d’entraînement et garder une supervision humaine limitent les attaques sur l’IA."}, "84": {"r": "C", "e": "Un rootkit s’intègre au système : seule une réinstallation depuis un support sain, puis une restauration de données vérifiées, est fiable."}, "85": {"r": "B", "e": "Le serveur est amené à interroger une ressource interne à la place de l’attaquant : c’est du SSRF."}, "86": {"r": "D", "e": "Un accès non documenté qui contourne l’authentification est une porte dérobée (backdoor)."}, "87": {"r": "BC", "e": "Le code qui se réécrit est de la mutation, et ses fragments dispersés relèvent de l’infection fractionnée (split infection) : deux techniques qui déjouent les signatures."}, "88": {"r": "D", "e": "Le rejeu consiste à renvoyer des messages capturés : l’attaquant n’a pas besoin du secret en clair."}, "89": {"r": "E", "e": "Aucune association n’est correcte : le PUP trompe, le ver se propage (lancer), le keylogger espionne, la bombe logique se déclenche (lancer)."}, "90": {"r": "A", "e": "Contre le SSRF, on restreint les destinations à une liste approuvée (liste blanche). Les jetons CSRF et l’encodage de sortie ne concernent pas cette attaque."}, "91": {"r": "C", "e": "Une valeur qui dépasse le maximum et repasse en négatif est un débordement d’entier."}, "92": {"r": "B", "e": "Les traces d’erreur détaillées divulguent des informations exploitables : mauvaise gestion des exceptions."}, "93": {"r": "E", "e": "Un virus de fichier, une fois exécuté, délivre sa charge et se réplique en insérant son code dans d’autres fichiers."}, "94": {"r": "D", "e": "Un outil légitime signalé comme malveillant est un faux positif."}, "95": {"r": "E", "e": "Une application inutile avec publicités est un adware / PUP, qui ne figure pas dans les propositions."}, "96": {"r": "A", "e": "L’API livre des données sans vérifier les droits du demandeur : c’est une vulnérabilité d’API (contrôle d’accès défaillant)."}, "97": {"r": "C", "e": "Collecter navigation et recherches pour un tiers sans consentement : logiciel espion."}, "98": {"r": "B", "e": "Le bot herder contrôle le botnet et envoie ses instructions aux machines infectées."}, "99": {"r": "E", "e": "Il s’agit d’un débordement de tampon, qui n’est pas proposé."}, "100": {"r": "C", "e": "Un code qui se déclenche sur une condition (matricule absent de la liste) est une bombe logique."}, "101": {"r": "A", "e": "Changement de page d’accueil et publicités sans vol de données ni accès distant : PUP."}, "102": {"r": "D", "e": "Les algorithmes et les données d’entraînement peuvent être manipulés : une IA n’est pas infaillible et ne remplace pas les analystes."}, "103": {"r": "B", "e": "Un pilote tiers vulnérable est un composant logiciel externe : manipulation de pilote de périphérique."}, "104": {"r": "E", "e": "L’objectif est la persistance (porte dérobée ou rootkit), qui n’est pas parmi les propositions."}, "105": {"r": "ACD", "e": "Rapidité de réaction, prédiction et prévention, apprentissage continu. L’IA n’est ni immune à la manipulation ni sans faux positifs."}, "106": {"r": "B", "e": "Contre le CSRF, on exige un jeton imprévisible propre à la session dans chaque requête sensible."}, "107": {"r": "C", "e": "Se propager par un service réseau sans action humaine ni fichier hôte : c’est un ver."}, "108": {"r": "A", "e": "Le CSRF exploite justement la session déjà authentifiée de la victime."}, "109": {"r": "D", "e": "Une requête forgée est soumise avec les droits de l’utilisateur connecté : CSRF."}, "110": {"r": "B", "e": "Un programme qui fonctionne mais ouvre un accès distant à un tiers est un cheval de Troie d’accès distant (RAT)."}, "111": {"r": "C", "e": "Si le répertoire de recherche est inscriptible par tous, un attaquant peut y déposer une DLL malveillante qui sera chargée à la place de la légitime."}, "112": {"r": "E", "e": "C’est un virus « appender » : code ajouté en fin de fichier et saut initial. Cette technique n’est pas dans les propositions."}, "113": {"r": "A", "e": "Limiter les droits d’écriture du poste aux seuls partages nécessaires (moindre privilège) restreint ce que le cryptomalware peut chiffrer."}, "114": {"r": "D", "e": "Un OS qui ne voit rien alors qu’un démarrage externe trouve les fichiers : le rootkit masque sa présence dans les couches basses."}, "115": {"r": "B", "e": "Un écran de blocage avec fausse amende, sans chiffrement des fichiers, est un ransomware de type « locker »."}, "116": {"r": "C", "e": "C’est un XSS stocké : la cause racine est l’absence de validation et d’encodage des entrées réaffichées."}, "117": {"r": "B", "e": "Des sessions jamais libérées qui saturent la mémoire : épuisement de ressources."}, "118": {"r": "A", "e": "Le XSS vise les navigateurs des autres utilisateurs, où le script s’exécute."}, "119": {"r": "D", "e": "Des scripts en mémoire lancés via des outils natifs et relancés par une configuration : virus sans fichier (fileless) persistant. L’absence de fichier ne prouve rien."}, "120": {"r": "BCE", "e": "Keylogger : espionner, rootkit : échapper à la détection, cryptomalware : emprisonner. Le PUP trompe et le ver se propage (lancer)."}, "121": {"r": "A", "e": "Une transaction signée acceptée une seconde fois : exposition au rejeu (replay)."}, "122": {"r": "D", "e": "Le chiffrement protège la base au repos : le script est déchiffré à l’affichage et renvoyé tel quel au navigateur."}, "123": {"r": "C", "e": "Redirection vers un moteur inconnu et pop-unders : PUP qui modifie le navigateur, pas un rootkit."}, "124": {"r": "E", "e": "Pour restaurer au lieu de payer, il faut des sauvegardes hors d’atteinte du malware et testées."}, "125": {"r": "C", "e": "L’analyse statique ne reconnaît que ce qui correspond à des signatures connues."}, "126": {"r": "A", "e": "La protection anti-falsification (tamper protection) empêche la modification des paramètres de l’antivirus, notamment via le registre."}, "127": {"r": "D", "e": "Isoler un fichier suspect dans une zone où il ne peut plus s’exécuter : mise en quarantaine."}, "128": {"r": "BC", "e": "Envoyer des entrées aléatoires ou malformées à un programme en exécution est du fuzzing, une technique d’analyse dynamique."}, "129": {"r": "E", "e": "Le mode legacy fait perdre les contrôles d’intégrité du démarrage d’UEFI (secure boot, measured boot)."}, "130": {"r": "BD", "e": "On décide du chiffrement dès la conception et on gère la mémoire correctement. Pas de clair ni de numéros dans les journaux."}, "131": {"r": "E", "e": "Il s’agit de l’attestation à distance (remote attestation), qui n’est pas proposée.", "d": 1}, "132": {"r": "A", "e": "Un programme gouvernemental d’échange d’informations non classifiées entre analystes et partenaires.", "d": 1}, "133": {"r": "E", "e": "Le décommissionnement (deprovisioning) a été négligé, il n’est pas dans les propositions.", "d": 1}, "134": {"r": "C", "e": "Le staging valide le comportement dans des conditions proches de la production, par exemple avec les intégrations réelles."}, "135": {"r": "B", "e": "Seules huit applications sont permises : liste d’autorisation (allow list)."}, "136": {"r": "D", "e": "La traversée de répertoire sur un portail public est exposée et peut divulguer des fichiers sensibles : priorité à l’exposition."}, "137": {"r": "A", "e": "Réduire la surface d’attaque : désactiver les services et ports inutiles (FTP, Telnet, base)."}, "138": {"r": "C", "e": "SecDevOps intègre la sécurité de façon automatisée tout au long du cycle. Un audit annuel après la production passe à côté."}, "139": {"r": "B", "e": "Une liste de blocage ne contient que ce qui est déjà connu, donc pas un malware inédit."}, "140": {"r": "A", "e": "Contre la traversée de répertoire : normaliser les chemins et les valider par rapport à la racine."}, "141": {"r": "BD", "e": "UEFI gère les disques de plus de 2 To et peut intégrer des fonctions réseau. La limite de quatre partitions principales est celle du BIOS."}, "142": {"r": "E", "e": "Les séquences de remontée de répertoire (../) visent une traversée de répertoire, absente des propositions."}, "143": {"r": "C", "e": "L’ordre habituel : développement, test, staging (préproduction), puis production."}, "144": {"r": "D", "e": "Des mises à jour imposées évitent que des postes restent non corrigés par choix des utilisateurs."}, "145": {"r": "A", "e": "Passer de la lecture de fichiers à l’exécution de commandes sur le serveur est une injection de commandes."}, "146": {"r": "B", "e": "Avant la compilation, on analyse le code source : analyse statique (SAST)."}, "147": {"r": "E", "e": "La cascade est séquentielle, tandis que l’agile procède par incréments."}, "148": {"r": "C", "e": "L’attaque est réelle mais a échoué (404) : le pare-feu l’a correctement détectée. Ce n’est ni un faux positif ni un faux négatif."}, "149": {"r": "D", "e": "HSTS et X-Frame-Options sont des en-têtes de réponse HTTP de sécurité."}, "150": {"r": "A", "e": "Une plateforme où chaque membre est approuvé est une source fermée (closed source)."}, "151": {"r": "B", "e": "Bloquer l’éditeur du registre par stratégie de groupe empêche la modification de paramètres sensibles, y compris par un malware."}, "152": {"r": "C", "e": "Les indicateurs partagés peuvent être obsolètes ou faux : il faut les qualifier avant tout blocage automatique."}, "153": {"r": "E", "e": "Sans l’attribut Secure, le cookie peut transiter sur une connexion non chiffrée et être intercepté."}, "154": {"r": "D", "e": "Un bac à sable (sandbox) isolé permet d’exécuter et d’observer un fichier suspect sans risque pour le poste ni le réseau."}, "155": {"r": "A", "e": "Des journaux jamais consultés ni centralisés laissent des signaux précoces d’attaque inexploités."}, "156": {"r": "B", "e": "La préoccupation légitime est de divulguer par inadvertance des informations propriétaires ou sensibles avec les IOC."}, "157": {"r": "C", "e": "Pour appliquer les mêmes paramètres à 400 postes : un modèle de sécurité déployé de manière centralisée."}, "158": {"r": "E", "e": "Un outil qui alerte sans bloquer est un HIDS, un outil qui empêche l’action est un HIPS."}, "159": {"r": "B", "e": "Un malware exécuté avant l’OS exige de confirmer l’intégrité du démarrage (secure boot, measured boot)."}, "160": {"r": "D", "e": "Corréler les événements de nombreux terminaux dans une base centralisée : c’est le rôle d’un EDR."}, "161": {"r": "A", "e": "Le malware a différé son action au-delà de la fenêtre d’observation du bac à sable, une technique d’évasion connue."}, "162": {"r": "C", "e": "Un message légitime bloqué par un filtre fondé sur les fréquences de mots : faux positif d’un filtre bayésien."}, "163": {"r": "D", "e": "Deux développements indépendants comparés en continu (diversité logicielle) permettent de détecter les erreurs et d’accroître la fiabilité."}, "164": {"r": "E", "e": "Un firmware falsifié est une attaque sur le firmware (chaîne d’approvisionnement), absente des propositions."}, "165": {"r": "C", "e": "STIX est le format structuré des indicateurs, TAXII est le protocole de transport (sur HTTPS) pour les échanger."}, "166": {"r": "A", "e": "Valider les correctifs sur un groupe pilote avant le déploiement général concilie sécurité et continuité."}, "167": {"r": "B", "e": "La détection ne remplace pas la réduction de la surface d’attaque : le durcissement reste nécessaire."}, "168": {"r": "AE", "e": "L’intégration continue et la surveillance continue sont des automatisations propres à SecDevOps."}, "169": {"r": "B", "e": "L’automatisation du partage d’indicateurs vise la rapidité d’échange."}, "170": {"r": "D", "e": "Un dépôt de fichiers et de code partagé (par exemple par les victimes) permet de voir si d’autres ont déjà rencontré l’échantillon."}, "171": {"r": "C", "e": "Le code s’exécute avant l’OS et ses protections : il faut vérifier l’intégrité du démarrage."}, "172": {"r": "D", "e": "Des identifiants à vendre se cherchent sur le dark web, de façon encadrée et avec précautions."}, "173": {"r": "B", "e": "Une racine de confiance matérielle ne peut pas être modifiée comme un logiciel."}, "174": {"r": "C", "e": "Livraison automatique en production dès que tous les tests passent : déploiement continu."}, "175": {"r": "A", "e": "Les cartes de menaces montrent des tendances mondiales, pas l’exposition propre de l’organisation."}, "176": {"r": "E", "e": "Il faut trier : écarter les faux positifs justifiés (code mort) et corriger les vraies vulnérabilités."}, "177": {"r": "B", "e": "Un seuil dépassé est un indicateur clé de risque (KRI) qui peut signaler une compromission possible : il faut enquêter."}, "178": {"r": "C", "e": "Un EDR agrège les données de nombreux terminaux et applique des analyses avancées."}, "179": {"r": "AE", "e": "Désactiver les comptes par défaut et appliquer la fonctionnalité minimale font partie du durcissement de base."}, "180": {"r": "D", "e": "Le second moteur détecte pareils portés par l’utilisateur (wearables) : aucun des termes proposés ne convient.", "d": 1}, "197": {"r": "C", "e": "Avec la VDI, les données restent sur le serveur et ne sont jamais stockées sur le smartphone."}, "198": {"r": "AD", "e": "Sur iPhone, le contournement des restrictions est un jailbreak, et installer depuis une boutique non officielle est du sideloading. Le rooting concerne Android."}, "199": {"r": "B", "e": "Il ne faut ni résister ni poursuivre le voleur : la sécurité de la personne prime."}, "200": {"r": "C", "e": "Terminal fourni et contrôlé par l’entreprise, usage strictement professionnel : corporate owned."}, "201": {"r": "D", "e": "Les systèmes embarqués d’un véhicule pilotent freinage et direction : une compromission met des vies en danger."}, "202": {"r": "AB", "e": "Un chiffrement robuste consomme de l’énergie et du calcul, ce qui limite l’autonomie du capteur."}, "203": {"r": "E", "e": "Faire confiance à tout appareil du réseau est une confiance implicite, absente des propositions."}, "204": {"r": "C", "e": "Un schéma simple et visible par les traces est une authentification faible, exposée à l’observation."}, "205": {"r": "D", "e": "L’UEM offre une console unique pour mobiles et ordinateurs."}, "206": {"r": "A", "e": "Une imprimante multifonction est un système spécialisé qui stocke des données : elle doit être sécurisée."}, "207": {"r": "B", "e": "La conteneurisation sépare données professionnelles et personnelles, ce qui facilite l’effacement sélectif et limite les litiges."}, "208": {"r": "C", "e": "Reconnu comme périphérique d’interface humaine, il obtient des droits comparables à ceux d’un clavier."}, "209": {"r": "BE", "e": "Ces modèles peuvent réduire les coûts et simplifier l’infrastructure. Ils n’éliminent pas les risques et ne suppriment pas le besoin d’outils de gestion."}, "210": {"r": "D", "e": "Ordinateur réduit avec navigateur et lecteur multimédia : ordinateur à base web."}, "211": {"r": "A", "e": "Créer, modifier et partager des documents depuis des mobiles avec un contrôle centralisé relève du MCM (gestion de contenu mobile).", "d": 1}, "212": {"r": "C", "e": "Des images en clair sur une liaison radio peuvent être interceptées par des tiers."}, "213": {"r": "E", "e": "Des capteurs trop éloignés pour recevoir les mises à jour : contrainte de portée."}, "214": {"r": "B", "e": "Le MTSO (mobile telephone switching office) centralise le contrôle des émetteurs."}, "215": {"r": "E", "e": "Une puce reprogrammable après fabrication est un FPGA, absent des propositions."}, "216": {"r": "C", "e": "Sans mécanisme de mise à jour, la faille reste exploitable sur les appareils déployés."}, "217": {"r": "A", "e": "Absence de vérification de l’identité de l’expéditeur des commandes : contrainte d’authentification."}, "218": {"r": "D", "e": "L’administration achète les terminaux et autorise un usage personnel : COPE."}, "219": {"r": "C", "e": "La segmentation du stockage par conteneurisation permet un effacement sélectif des données professionnelles."}, "220": {"r": "B", "e": "L’infrarouge est lent et limité : il est rarement utilisé aujourd’hui."}, "221": {"r": "AD", "e": "Avec l’OTG, le smartphone joue le rôle d’hôte USB : une clé infectée peut le compromettre."}, "222": {"r": "C", "e": "Activer le micro à l’insu de l’utilisateur : enregistrement non autorisé."}, "223": {"r": "E", "e": "Il faut supprimer l’exposition directe d’un SCADA à Internet et imposer un accès distant contrôlé."}, "224": {"r": "BD", "e": "Un compteur intelligent transmet fréquemment les relevés et peut alerter en cas de manipulation ou de vol."}, "225": {"r": "A", "e": "Code de verrouillage, chiffrement et effacement à distance : c’est le rôle d’un MDM."}, "226": {"r": "BC", "e": "Une puce qui intègre processeur, mémoire, radio et énergie est un SoC, et un OS à temps de réponse déterministe est un RTOS."}, "227": {"r": "E", "e": "Il faut interdire par politique (MDM) l’installation depuis des sources non officielles."}, "2 ", "d": 1}, "242": {"r": "A", "e": "Pas d’achat ni de support : BYOD, avec le risque de mélange des données personnelles et professionnelles."}, "243": {"r": "D", "e": "Des localisations régulières exposées augmentent le risque d’attaque physique ciblée."}, "244": {"r": "E", "e": "La mesure réaliste est d’isoler l’équipement dans un segment réseau dédié, ce qui n’est pas proposé."}, "245": {"r": "B", "e": "Avec la fonction « photo du voleur », après trois échecs, la caméra prend une photo envoyée au propriétaire."}, "246": {"r": "C", "e": "Une interface unique pour terminaux, applications et contenus : UEM."}, "247": {"r": "D", "e": "Identifiants par défaut faibles et non modifiables : paramètres par défaut faibles."}, "248": {"r": "C", "e": "Effacer tout l’appareil détruit aussi les données personnelles de l’employé : risque juridique."}, "249": {"r": "AB", "e": "La cryptographie sur courbes elliptiques offre une sécurité comparable à RSA avec des clés plus courtes et moins de calcul, donc adaptée aux mobiles."}, "250": {"r": "E", "e": "Principe de Kerckhoffs : la sécurité doit reposer sur le secret de la clé, pas sur celui de l’algorithme."}, "251": {"r": "B", "e": "La confidentialité persistante parfaite (PFS) protège les sessions passées en cas de vol de clé privée."}, "252": {"r": "C", "e": "Des données non chiffrées au repos et en transit sont des données en clair (cleartext)."}, "253": {"r": "A", "e": "Avec le chiffrement symétrique, la difficulté est la distribution sécurisée des clés partagées."}, "254": {"r": "BCD", "e": "Empreinte de taille fixe, résistance à la préimage et résistance aux collisions. Un hachage n’est pas réversible."}, "255": {"r": "E", "e": "Les clés détruites, les données chiffrées deviennent définitivement illisibles."}, "256": {"r": "A", "e": "La clé unique doit rester secrète entre émetteur et destinataire, d’où « clé privée »."}, "257": {"r": "E", "e": "Un registre partagé, immuable et vérifiable est une blockchain, qui n’est pas pr e": "HTTPS utilise le port 443."}, "343": {"r": "E", "e": "Il s’agit d’un défaut de validation des certificats : aucune qualification proposée ne correspond."}, "344": {"r": "D", "e": "Une seule clé privée sur 40 serveurs : sa compromission expose tous les sous-domaines."}, "345": {"r": "AC", "e": "La robustesse d’une clé dépend de sa longueur et de son caractère aléatoire."}, "346": {"r": "B", "e": "Un dépôt de certificats sert à consulter les certificats et leur statut."}, "347": {"r": "D", "e": "La conception et la preuve d’un protocole sont bien plus complexes que celles d’un algorithme."}, "348": {"r": "E", "e": "Le séquestre de clés (key escrow) est décrit, il n’est pas proposé."}, "349": {"r": "A", "e": "Plusieurs sous-domaines d’un même domaine : certificat joker (wildcard)."}, "350": {"r": "BC", "e": "On révoque quand la clé privée est compromise ou que les informations du certificat ont changé."}, "351": {"r": "A", "e": "SSH remplace Telnet : il chiffre la session, y compris les mots de passe, que Telnet envoie en clair."}, "352": {"r": "D", "e": "Un certificat à validation étendue (EV) repose sur une vérification approfondie de l’identité juridique."}, "353": {"r": "C", "e": "Plusieurs autorités qui signent chacune pour leur périmètre : modèle de confiance distribué."}, "354": {"r": "E", "e": "Un certificat multi-domaines (SAN) est adapté, il n’est pas proposé. Le joker ne couvre que les sous-domaines d’un même domaine."}, "355": {"r": "B", "e": "Les membres se signent mutuellement leurs clés : réseau de confiance (web of trust), difficile à gérer à grande échelle."}, "356": {"r": "C", "e": "La CRL est une liste volumineuse téléchargée périodiquement, avec un délai avant prise en compte d’une révocation."}, "357": {"r": "A", "e": "L’intermédiaire n’est ni transmis ni connu du client : la chaîne de certificats est incomplète."}, "358": {"r": "E", "e": "Il s’agit de la suspension (temporaire et réversible), qui n’est pas proposée."}, "359": {"r": "D", "e": ilités qui produit un rapport priorisé."}, "377": {"r": "E", "e": "Il faudrait un PDS (protected distribution system) pour protéger les câbles, absent des propositions."}, "378": {"r": "B", "e": "Une serrure qui s’ouvre avec un smartphone par Bluetooth est une serrure intelligente."}, "379": {"r": "A", "e": "Le contrôle à deux personnes empêche qu’une seule personne agisse sans contrôle."}, "380": {"r": "D", "e": "OpenSSL permet de scripter génération de clés, CSR, etc."}, "381": {"r": "C", "e": "La sécurité des ports limite les attaques par inondation et clonage MAC."}, "382": {"r": "AD", "e": "Le mode Protégé et les emplacements approuvés limitent l’exécution de macros dans les documents reçus."}, "383": {"r": "C", "e": "Un câble antivol dans la fente de sécurité protège contre le vol rapide."}, "384": {"r": "B", "e": "Exécuter les macros uniquement depuis un dossier contrôlé : emplacements approuvés (Trusted Locations)."}, "385": {"r": "C", "e": "Les commandes de PowerShell s’appellent des cmdlets."}, "386": {"r": "AB", "e": "Une attaque DNS peut nuire à la réputation et rediriger les URL vers des sites malveillants."}, "387": {"r": "D", "e": "Un sas (mantrap) à deux portes empêche le talonnage."}, "388": {"r": "C", "e": "Une entrée ajoutée au fichier hosts local est un empoisonnement DNS local (table de l’hôte)."}, "389": {"r": "D", "e": "L’eau peut endommager et contaminer les équipements électroniques : on utilise des gaz inertes ou la poudre."}, "390": {"r": "B", "e": "L’empoisonnement ARP repose sur l’usurpation d’adresse MAC."}, "391": {"r": "A", "e": "tcpreplay rejoue un trafic capturé (éventuellement modifié) sur un réseau de test."}, "392": {"r": "E", "e": "Un système à agent propre (clean agent) éteint sans endommager les équipements : adapté aux salles informatiques."}, "393": {"r": "BC", "e": "L’analyse complète des paquets révèle des comportements inhabituels et des connexions régulières vers un serveur C2. Elle ne corrige rien automatiquement."}, "3 é."}, "428": {"r": "C", "e": "Cuckoo est un bac à sable d’analyse automatisée de malware qui produit un rapport détaillé."}, "429": {"r": "A", "e": "Défense en profondeur : après le périmètre viennent les contrôles internes (serrures, zones sécurisées, sas)."}, "430": {"r": "B", "e": "Un capteur de mouvement détecte et alerte les gardiens d’une action inattendue."}, "431": {"r": "E", "e": "Concaténer des entrées utilisateur dans des commandes est de l’injection de commandes : il faut valider les entrées et ne pas les insérer dans les commandes."}, "432": {"r": "D", "e": "Une connexion régulière jour et nuit, petits paquets, domaine récent : balises vers un serveur de commande et de contrôle."}, "433": {"r": "C", "e": "Des millions de requêtes depuis des dizaines de milliers de machines infectées à leur insu : DDoS."}, "434": {"r": "B", "e": "tcpdump capture des paquets en ligne de commande, adapté à une session SSH."}, "435": {"r": "A", "e": "Une inondation de la table MAC force le commutateur à diffuser le trafic sur tous les ports (comme un concentrateur), ce qui permet l’écoute."}, "436": {"r": "E", "e": "C’est un système de télévision en circuit fermé (CCTV), qui n’est pas proposé."}, "437": {"r": "D", "e": "Des patrouilles automatisées avec caméras et détection d’objets : robots sentinelles."}, "438": {"r": "BC", "e": "Un round-robin sans persistance de session envoie les requêtes d’un même client vers différents serveurs, d’où le panier perdu."}, "439": {"r": "E", "e": "Il s’agit d’un NIPS (système de prévention d’intrusion réseau), qui n’est pas proposé."}, "440": {"r": "D", "e": "Un serveur qui reçoit les requêtes externes et les route vers les serveurs internes : proxy inverse."}, "441": {"r": "A", "e": "Se demander si le code fera quelque chose de nuisible, avec des techniques fondées sur l’expérience : heuristique."}, "442": {"r": "C", "e": "Bloquer des catégories de sites : filtrage de contenu et d’URL."}, "443": {"r": "B", "e": "De fausses informations de routage visent la sécurité des routes (route security)."}, "444": {"r": "A", "e": "Bloquer des protocoles à l’entrée sur un routeur de bordure : ACL réseau sur le routeur externe."}, "445": {"r": "D", "e": "Une PME sans équipe dédiée peut recourir à un service de surveillance externe (SOC managé)."}, "446": {"r": "C", "e": "Serveurs publics dans une zone isolée du réseau interne : zone démilitarisée (DMZ)."}, "447": {"r": "B", "e": "La détection par anomalie exige une référence fiable du comportement normal."}, "448": {"r": "E", "e": "Un équilibreur actif et un autre en attente : actif-passif, absent des propositions."}, "449": {"r": "D", "e": "Un agent dissoluble s’exécute le temps de l’évaluation puis disparaît."}, "450": {"r": "A", "e": "Un IPS doit être en ligne pour bloquer, avec le risque de couper le trafic en cas de panne ou d’erreur."}, "451": {"r": "C", "e": "Il aurait fallu inspecter aussi le trafic sortant : inspection bidirectionnelle."}, "452": {"r": "E", "e": "Sans accès au coffre de correspondance, les jetons n’ont pas de valeur exploitable."}, "453": {"r": "B", "e": "L’IDS détecte et alerte, l’IPS tente de bloquer."}, "454": {"r": "C", "e": "Le protocole STP (802.1d) évite les boucles de commutation et les tempêtes de diffusion."}, "455": {"r": "AD", "e": "Un tunnel partagé (split tunnel) envoie seul le trafic d’entreprise dans le tunnel : le reste échappe aux contrôles."}, "456": {"r": "B", "e": "Écrire des règles en termes génériques (qui peut utiliser quoi) est l’approche d’un pare-feu à politiques."}, "457": {"r": "C", "e": "Copier le trafic de plusieurs ports vers un port de surveillance : port mirroring."}, "458": {"r": "E", "e": "C’est un faux positif d’un IPS en ligne, ce qui n’est pas proposé tel quel."}, "459": {"r": "D", "e": "Un DLP inspecte le contenu en contexte et bloque l’envoi de données sensibles."}, "460": {"r": "A", "e": "Une simple invite de connexion qui enregistre les tentatives : pot de miel à faible interaction."}, "461": {"r": "B", "e": "Poste non conforme placé en réseau isolé vers le serveur de mises à jour : NAC."}, "462": {"r": "C", "e": "Un serveur de rebond doit être minimaliste pour réduire sa surface d’attaque."}, "463": {"r": "E", "e": "Un module de sécurité matériel réseau (HSM) génère, stocke et utilise des clés avec un générateur aléatoire matériel."}, "464": {"r": "A", "e": "Le zero trust repose sur une segmentation du réseau."}, "465": {"r": "D", "e": "Un TAP matériel indépendant copie le trafic sans perte, même sous forte charge."}, "466": {"r": "B", "e": "Un moniteur d’intégrité détecte les modifications de fichiers : utile contre les malwares et pour la conformité."}, "467": {"r": "C", "e": "Détecter une action suspecte d’un programme et demander confirmation : surveillance comportementale."}, "468": {"r": "AE", "e": "Un serveur DLP peut bloquer, mettre en quarantaine ou rediriger vers une personne habilitée."}, "469": {"r": "D", "e": "Les postes passent par un serveur qui analyse les téléchargements et masque les adresses : proxy direct (forward proxy)."}, "470": {"r": "C", "e": "Pour observer en détail les attaquants : pot de miel à forte interaction, avec le risque de rebond s’il est mal isolé."}, "471": {"r": "B", "e": "Une variante qui passe sans alerte est un faux négatif : le moteur à signatures ne la reconnaît pas."}, "472": {"r": "E", "e": "Le premier suit les sessions dans une table (à états), le second examine chaque paquet isolément (sans état)."}, "473": {"r": "CD", "e": "Un pot de miel sert à étudier les techniques des attaquants et à les détourner des actifs réels."}, "474": {"r": "A", "e": "Examiner l’état des postes via le contrôleur de domaine, sans agent : NAC sans agent."}, "475": {"r": "B", "e": "Un UTM regroupe plusieurs fonctions de sécurité, avec le risque de point de défaillance unique."}, "476": {"r": "E", "e": "Un volume anormal détecté par rapport à la référence est une détection par anomalie, ici un faux positif car l’activité est légitime."}, "477": {"r": "C", "e": "La QoS avec mise en forme du trafic permet de prioriser les flux vocaux."}, "478": {"r": "ABD", "e": "Un équilibreur de charge peut détecter et prévenir certaines attaques (protocoles, serveur ou application) et masquer pages d’erreur et en-têtes d’identification.", "d": 1}, "479": {"r": "E", "e": "Il s’agit de la segmentation par VLAN, non proposée."}, "480": {"r": "BC", "e": "Un proxy peut masquer les adresses IP internes et intercepter un malware avant le terminal."}, "481": {"r": "E", "e": "C’est la tokenisation : jetons aléatoires sans lien mathématique, avec les originaux dans un coffre séparé."}, "482": {"r": "AD", "e": "Des conventions de nommage et un schéma d’adressage IP avec des diagrammes à jour permettent d’identifier rapidement équipements et réseaux."}, "483": {"r": "C", "e": "Un proxy inverse peut terminer TLS avec les clés protégées par un HSM réseau."}, "484": {"r": "B", "e": "Un serveur de rebond (jump box) minimaliste et contrôlé sert de point d’accès à la DMZ."}, "485": {"r": "A", "e": "Tous les équilibreurs traitent le trafic en permanence : actif-actif."}, "486": {"r": "C", "e": "Rediriger les requêtes vers un serveur contrôlé qui les journalise : gouffre DNS (sinkhole)."}, "487": {"r": "E", "e": "C’est une passerelle NAT, non proposée."}, "488": {"r": "D", "e": "Deux agences reliées en permanence, sans action des utilisateurs : VPN site à site."}, "489": {"r": "AB", "e": "Les VPN utilisent surtout SSL/TLS et IPsec."}, "490": {"r": "C", "e": "La gestion hors bande reste accessible si le réseau surveillé tombe."}, "491": {"r": "D", "e": "La règle implicite de refus bloque le DNS : sans résolution de noms, la navigation échoue."}, "492": {"r": "B", "e": "Des commerciaux nomades : VPN d’accès distant."}, "493": {"r": "E", "e": "Une DMZ entre deux pare-feu, avec des flux internes strictement limités, freine la progression."}, "494": {"r": "AC", "e": "Un pare-feu à états suit l’état de la connexion, et un pare-feu peut être un hôte, une appliance ou virtuel."}, "495": {"r": "D", "e": "Un pare-feu applicatif web (WAF) filtre injections SQL et XSS."}, "496": {"r": "B", "e": "Un tunnel complet envoie tout le trafic au siège, ce qui accroît la charge et la bande passante."}, "497": {"r": "C", "e": "Une configuration de référence sécurisée sert de base commune à tous les équipements."}, "498": {"r": "D", "e": "Des droits par service sur un dossier : ACL du système de fichiers."}, "499": {"r": "E", "e": "Plusieurs leurres interconnectés simulant un réseau : honeynet."}, "500": {"r": "AB", "e": "Un système sur port miroir est passif : il ne bloque pas, et sa panne n’interrompt pas le trafic."}};
const KEY = 'qcm-secu-v1', AKEY = 'qcm-secu-answers-v1';

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let progress = load(KEY, {});            // id -> {box, last, n}
let answers = Object.assign({}, ANSWERS_BUILTIN, load(AKEY, {})); // id -> {r:"B", e:"..."}
let queue = [], idx = 0, session = {ok:0, ko:0}, current = null, picked = new Set(), locked = false;

const $ = id => document.getElementById(id);
const hasAns = q => answers[q.id] && answers[q.id].r;

function init(){
  const sel = $('mod');
  sel.innerHTML = '<option value="0">Tous les modules</option>' +
    DATA.modules.map(m => `<option value="${m.id}">Module ${m.id} – ${m.titre}</option>`).join('');
  refresh();
}
function refresh(){
  const total = DATA.questions.length, withAns = DATA.questions.filter(hasAns).length;
  $('sub').textContent = withAns + ' questions avec corrigé sur ' + total;
  const ids = DATA.questions.filter(hasAns).map(q => q.id);
  let seen=0, ok=0, ko=0;
  ids.forEach(id => { const p = progress[id]; if(p){ seen++; if(p.last) { if((p.box||1)>=3) ok++; } else ko++; } });
  $('sSeen').textContent = seen; $('sOk').textContent = ok; $('sKo').textContent = ko;
  $('barfill').style.width = ids.length ? Math.round(100*ok/ids.length)+'%' : '0';
}

function pool(){
  const m = +$('mod').value, mode = $('mode').value;
  let qs = DATA.questions.filter(q => hasAns(q) && (!m || q.module === m));
  if(mode === 'new') qs = qs.filter(q => !progress[q.id]);
  if(mode === 'wrong') qs = qs.filter(q => progress[q.id] && !progress[q.id].last);
  return qs;
}
function weight(q){ const p = progress[q.id]; return p ? Math.max(1, 6 - (p.box||1)) * (p.last ? 1 : 2) : 4; }
function buildQueue(qs, mode){
  if(mode === 'all') return qs.slice();
  const a = qs.slice(), out = [];
  while(a.length){
    const tot = a.reduce((s,q) => s + weight(q), 0); let r = Math.random() * tot, i = 0;
    for(; i < a.length; i++){ r -= weight(a[i]); if(r <= 0) break; }
    out.push(a.splice(Math.min(i, a.length-1), 1)[0]);
  }
  return out;
}

function start(){
  const qs = pool();
  if(!qs.length){
    alert(Object.keys(answers).length ? 'Aucune question ne correspond à ce filtre.' : 'Pas encore de corrigé : importe un fichier JSON de réponses.');
    return;
  }
  queue = buildQueue(qs, $('mode').value).slice(0, 50 > qs.length ? qs.length : 50);
  if($('mode').value === 'all') queue = qs.slice();
  idx = 0; session = {ok:0, ko:0};
  $('setup').classList.add('hide'); $('quiz').classList.remove('hide');
  show();
}

function show(){
  current = queue[idx]; picked = new Set(); locked = false;
  const a = answers[current.id].r, multi = a.length > 1;
  const mod = DATA.modules.find(m => m.id === current.module);
  $('qmeta').textContent = 'Q' + current.id + ' · Module ' + current.module;
  $('qcount').textContent = (idx+1) + ' / ' + queue.length + ' · ✓ ' + session.ok + ' ✗ ' + session.ko;
  $('qtext').textContent = current.question + (multi ? ' (' + a.length + ' réponses)' : '');
  $('opts').innerHTML = '';
  Object.entries(current.choix).forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.k = k;
    b.innerHTML = '<b>' + k + ')</b><span></span>'; b.lastChild.textContent = t;
    b.onclick = () => choose(k, multi);
    $('opts').appendChild(b);
  });
  $('validate').classList.toggle('hide', !multi);
  $('validate').disabled = true;
  $('result').innerHTML = '';
  $('next').disabled = true;
  $('next').textContent = idx === queue.length - 1 ? 'Voir le score' : 'Suivante';
}

function choose(k, multi){
  if(locked) return;
  if(!multi){ picked = new Set([k]); grade(); return; }
  picked.has(k) ? picked.delete(k) : picked.add(k);
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', picked.has(b.dataset.k)));
  $('validate').disabled = picked.size === 0;
}

function grade(){
  locked = true;
  const good = new Set(answers[current.id].r.split(''));
  const okAll = good.size === picked.size && [...good].every(x => picked.has(x));
  document.querySelectorAll('.opt').forEach(b => {
    b.classList.remove('sel');
    if(good.has(b.dataset.k)) b.classList.add('ok');
    else if(picked.has(b.dataset.k)) b.classList.add('ko');
  });
  const p = progress[current.id] || {box:1, n:0};
  p.n++; p.last = okAll; p.box = okAll ? Math.min(5, (p.box||1)+1) : 1;
  progress[current.id] = p; save(KEY, progress);
  okAll ? session.ok++ : session.ko++;
  const e = answers[current.id].e;
  const r = $('result'); r.innerHTML = '';
  const v = document.createElement('div'); v.className = 'verdict ' + (okAll ? 'ok' : 'ko');
  v.textContent = okAll ? '✓ Correct' : '✗ Incorrect – bonne réponse : ' + [...good].join(', ');
  r.appendChild(v);
  if(e){ const d = document.createElement('div'); d.className = 'expl'; d.textContent = e; r.appendChild(d); }
  if(answers[current.id].d){ const w = document.createElement('div'); w.className = 'expl doubt'; w.textContent = '⚠ Réponse à vérifier dans ton cours : le corrigé généré présente ici un doute.'; r.appendChild(w); }
  $('validate').classList.add('hide');
  $('next').disabled = false;
  $('qcount').textContent = (idx+1) + ' / ' + queue.length + ' · ✓ ' + session.ok + ' ✗ ' + session.ko;
  refresh();
}

function next(){
  if(idx < queue.length - 1){ idx++; show(); return; }
  end();
}
function end(){
  $('quiz').classList.add('hide'); $('setup').classList.remove('hide');
  const done = session.ok + session.ko;
  if(done) alert('Session terminée : ' + session.ok + ' / ' + done + ' (' + Math.round(100*session.ok/done) + ' %)');
  refresh();
}

$('start').onclick = start;
$('next').onclick = next;
$('stop').onclick = end;
$('validate').onclick = grade;
$('reset').onclick = () => { if(confirm('Effacer toute ta progression ?')){ progress = {}; save(KEY, progress); refresh(); } };
$('imp').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const j = JSON.parse(await f.text()), norm = {};
    Object.entries(j).forEach(([id, v]) => {
      const r = String(typeof v === 'string' ? v : v.r || v.reponse || '').toUpperCase().replace(/[^A-E]/g,'');
      if(r) norm[id] = {r: [...new Set(r)].sort().join(''), e: (v && (v.e || v.explication)) || '', d: v && v.d ? 1 : 0};
    });
    answers = Object.assign({}, answers, norm); save(AKEY, norm);
    $('impmsg').textContent = Object.keys(norm).length + ' réponses importées.';
    refresh();
  }catch(err){ $('impmsg').textContent = 'Fichier invalide.'; }
};
init();
</script>
