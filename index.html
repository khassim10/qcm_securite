<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM Sécurité – Entraînement</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1b1f24;--mut:#667085;--bd:#d9dde3;--ok:#16a34a;--okbg:#dcfce7;--ko:#dc2626;--kobg:#fee2e2;--acc:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--txt:#e8eaed;--mut:#9aa3b2;--bd:#2c313a;--okbg:#12361f;--kobg:#431616;--acc:#60a5fa}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
select,button,input[type=file]{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);padding:10px 14px;border-radius:10px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.02rem;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;align-items:flex-start}
.opt b{min-width:1.4em}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.expl{margin-top:12px;padding:12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:8px;font-size:.95rem}
.verdict{font-weight:600;margin-top:10px}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px}
.stats b{display:block;font-size:1.2rem}
small{color:var(--mut)}
.warn{font-size:.85rem;background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:14px;color:var(--mut)}
.expl.doubt{border-left-color:#d97706}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>QCM Sécurité – Entraînement</h1>
  <div class="sub" id="sub"></div>
  <div class="warn">Corrigé rédigé par Claude, sans corrigé officiel : à recouper avec ton cours. Les réponses marquées ⚠ sont celles où il y a un doute.</div>

  <div class="card" id="setup">
    <label for="mod">Module</label>
    <select id="mod"></select>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="smart">Intelligent (les questions ratées reviennent plus souvent)</option>
      <option value="new">Seulement les questions jamais vues</option>
      <option value="wrong">Seulement mes erreurs</option>
      <option value="all">Toutes, dans l’ordre</option>
    </select>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="start">Commencer</button>
      <button id="reset">Réinitialiser ma progression</button>
    </div>
    <label for="imp" style="margin-top:16px">Importer un corrigé (fichier JSON)</label>
    <input type="file" id="imp" accept=".json,application/json">
    <small id="impmsg"></small>
  </div>

  <div class="card" id="progress">
    <div class="stats">
      <div><b id="sSeen">0</b><small>vues</small></div>
      <div><b id="sOk">0</b><small>maîtrisées</small></div>
      <div><b id="sKo">0</b><small>à revoir</small></div>
    </div>
    <div class="bar" style="margin-top:10px"><i id="barfill" style="width:0"></i></div>
  </div>

  <div class="card hide" id="quiz">
    <div class="meta"><span id="qmeta"></span><span id="qcount"></span></div>
    <p class="q" id="qtext"></p>
    <div id="opts"></div>
    <button class="primary hide" id="validate">Valider</button>
    <div id="result"></div>
    <div class="row" style="margin-top:14px">
      <button id="stop">Terminer</button>
      <button class="primary" id="next" disabled>Suivante</button>
    </div>
  </div>
</div>

<script>
const DATA = {"modules": [{"id": 1, "titre": "Introduction à la sécurité"}, {"id": 3, "titre": "Menaces et attaques sur les terminaux"}, {"id": 4, "titre": "Sécurité des terminaux et du développement applicatif"}, {"id": 5, "titre": "Sécurité des appareils mobiles, embarqués et spécialisés"}, {"id": 6, "titre": "Cryptographie de base"}, {"id": 7, "titre": "Infrastructure à clés publiques et protocoles cryptographiques"}, {"id": 8, "titre": "Menaces réseau, évaluations et défenses"}, {"id": 9, "titre": "Équipements et technologies de sécurité réseau"}], "questions": [{"id": 1, "module": 1, "question": "Un attaquant appelle le standard d’une clinique, se présente comme le neveu d’un patient hospitalisé et obtient le numéro de chambre en racontant une anecdote drôle sur la famille. Quel principe psychologique est principalement exploité pour gagner la confiance ?", "choix": {"A": "Faire rire l’interlocuteur", "B": "L’évitement et la diversion", "C": "Le talonnage", "D": "La redirection", "E": "Projeter une autorité hiérarchique"}}, {"id": 2, "module": 1, "question": "Une banque impose des mots de passe de 16 caractères renouvelés tous les 30 jours, une déconnexion après 3 minutes d’inactivité et une double authentification à chaque action. Un audit constate que 40 % des guichetiers notent leurs mots de passe sur des post-it collés sous le clavier. Quelle analyse est la plus juste ?", "choix": {"A": "La double authentification rend les post-it inoffensifs, l’audit surestime donc le risque", "B": "Le durcissement excessif pousse les usagers à des contournements qui annulent une partie du gain", "C": "Il faut allonger les mots de passe à 20 caractères et imposer un renouvellement hebdomadaire", "D": "Le problème relève uniquement de la sensibilisation : la politique technique est irréprochable", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 3, "module": 1, "question": "La mise à jour officielle d’un logiciel de comptabilité, signée et téléchargée depuis le site de l’éditeur, contient une porte dérobée insérée dans l’environnement de compilation de l’éditeur. 3 000 clients l’installent automatiquement. Quel vecteur d’attaque est en cause ?", "choix": {"A": "Le cloud, car la mise à jour est hébergée en ligne", "B": "L’accès direct, car l’attaquant a accédé aux serveurs de l’éditeur", "C": "Les réseaux sociaux, car l’éditeur annonce ses mises à jour en ligne", "D": "Le courrier électronique, car la notification de mise à jour arrive par e-mail", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 4, "module": 1, "question": "Une entreprise affirme qu’un consultant est forcément un « white hat » parce qu’il travaille pour une société de conseil réputée. Quel critère détermine réellement cette qualification ?", "choix": {"A": "Le type d’outils qu’il utilise", "B": "La réputation de son employeur", "C": "L’existence d’une autorisation préalable pour ses actions", "D": "Le fait qu’il publie ou non ses découvertes après la mission", "E": "Le niveau de ses certifications professionnelles"}}, {"id": 5, "module": 1, "question": "Un employé reçoit l’appel d’un prétendu technicien du support qui connaît son nom et son service. L’interlocuteur affirme qu’une mise à jour bloque son compte et lui demande de lire le code à usage unique qu’il vient de recevoir par SMS. Quelles techniques sont combinées ?", "choix": {"A": "Pharming", "B": "Vishing", "C": "Smishing, car le code arrive par SMS", "D": "Usurpation d’un rôle (impersonation)", "E": "Watering hole"}}, {"id": 6, "module": 1, "question": "Dans un hôpital régional, un technicien modifie par erreur le coefficient de conversion des doses dans la base de la pharmacie. Les fiches restent consultables uniquement par les médecins habilités et le service reste disponible 24 h/24. Quelle propriété de sécurité est compromise en premier lieu ?", "choix": {"A": "La disponibilité, puisque des données fausses rendent le service inutilisable", "B": "L’authentification, puisque le technicien n’aurait pas dû pouvoir se connecter", "C": "L’intégrité des données de prescription", "D": "La confidentialité, puisqu’un technicien a manipulé une donnée médicale", "E": "La non-répudiation, puisque l’auteur de la modification n’est pas identifié"}}, {"id": 7, "module": 1, "question": "Un attaquant supprime les données d’une étude clinique ainsi que leurs sauvegardes, sans rien copier ni divulguer. Quel impact sur les données est le plus précisément décrit ?", "choix": {"A": "Usurpation d’identité", "B": "Exfiltration de données", "C": "Violation de données (data breach)", "D": "Perte de données (data loss)", "E": "Perte de réputation uniquement"}}, {"id": 8, "module": 1, "question": "Un audit relève trois écarts : (1) un routeur exposé sur Internet utilise encore le mot de passe d’administration par défaut ; (2) un poste Windows XP sert dans un laboratoire déconnecté du réseau ; (3) un correctif manque sur une application interne sans exploit connu. Avec une seule intervention possible cette semaine, laquelle est prioritaire ?", "choix": {"A": "Changer le mot de passe par défaut du routeur exposé", "B": "Rédiger une politique de gestion des correctifs", "C": "Appliquer le correctif manquant sur l’application interne", "D": "Remplacer le poste Windows XP du laboratoire", "E": "Lancer un test d’intrusion complet avant toute action"}}, {"id": 9, "module": 1, "question": "Un courriel signé « Département informatique » prévient qu’un « virus mortel » se cache dans un fichier système à l’icône d’ours et demande de supprimer ce fichier. Plusieurs postes deviennent instables après sa suppression. Quelle analyse est correcte ?", "choix": {"A": "Il s’agit d’un vishing, car le département informatique a été usurpé", "B": "Le fichier était réellement infecté, d’où l’instabilité constatée", "C": "Le message contenait un ver qui a supprimé le fichier automatiquement", "D": "Il s’agit d’un spim, car la consigne a circulé par messagerie", "E": "Il s’agit d’un hoax : l’utilisateur a lui-même dégradé le système"}}, {"id": 10, "module": 1, "question": "Le site marchand d’une entreprise est indisponible pendant six heures à cause d’une attaque. Dans quel ordre logique les effets sur l’organisation s’enchaînent-ils le plus souvent ?", "choix": {"A": "Atteinte à la réputation, puis perte financière et de productivité, puis perte de disponibilité", "B": "Perte de disponibilité, puis perte de productivité et financière, puis atteinte à la réputation", "C": "Perte de disponibilité, puis exfiltration, puis perte de données", "D": "Perte financière, puis perte de disponibilité, puis usurpation d’identité", "E": "Atteinte à la réputation, puis perte de disponibilité, puis perte financière"}}, {"id": 11, "module": 1, "question": "Lors d’un audit physique, on retrouve dans les poubelles d’une société : un organigramme, un annuaire téléphonique interne, un agenda indiquant les absences de la direction et un manuel système. L’attaquant veut se faire passer pour un responsable par téléphone. Quels documents sont les plus directement exploitables pour cette usurpation ?", "choix": {"A": "Le manuel système, qui révèle le type de matériel utilisé", "B": "Aucun, car une usurpation téléphonique ne s’appuie jamais sur des documents", "C": "L’annuaire, qui fournit noms et numéros à cibler ou imiter", "D": "Le manuel système, qui contient forcément les mots de passe par défaut", "E": "L’organigramme, qui désigne les personnes en position d’autorité"}}, {"id": 12, "module": 1, "question": "Un analyste SOC détecte un pic de trafic sortant entre le poste d’un développeur et un service de stockage personnel. Avant de qualifier l’incident, quel élément permet le mieux de distinguer un cas de shadow IT d’une menace interne malveillante ?", "choix": {"A": "L’intention : contourner une contrainte de travail ou nuire à l’organisation", "B": "Le type de service cloud utilisé", "C": "L’heure à laquelle les transferts ont eu lieu", "D": "L’ancienneté du développeur dans l’entreprise", "E": "Le volume de données transférées, nettement plus élevé dans les cas malveillants"}}, {"id": 13, "module": 1, "question": "Le système de gestion des correctifs d’une entreprise couvre l’OS de tous les postes, mais le lecteur PDF tiers installé sur 900 postes a quatre versions de retard. Quelle faiblesse décrit le mieux cette situation ?", "choix": {"A": "Une configuration par défaut non modifiée lors du déploiement", "B": "Une difficulté à patcher le firmware des postes", "C": "Une vulnérabilité de plateforme héritée", "D": "Des logiciels applicatifs peu corrigés", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 14, "module": 1, "question": "Un hôpital n’a subi aucune fuite ni aucune altération de données, mais la presse relaie une rumeur de piratage et des patients annulent leurs rendez-vous. Quel effet sur l’organisation est en jeu ?", "choix": {"A": "Une exfiltration de données", "B": "Une usurpation d’identité", "C": "Une perte de données", "D": "Une perte de disponibilité", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 15, "module": 1, "question": "Un agent d’entretien démarre un poste depuis une clé USB amorçable pendant la nuit pour copier le contenu du disque. Quel vecteur d’attaque principal est exploité ?", "choix": {"A": "La chaîne d’approvisionnement", "B": "Le courrier électronique", "C": "L’accès direct au matériel", "D": "Le support amovible, puisqu’une clé USB est utilisée", "E": "Le sans-fil"}}, {"id": 16, "module": 1, "question": "Le site d’un ministère est défiguré quelques heures après l’annonce d’une hausse des taxes sur les communications. Le message affiché dénonce la mesure, le groupe revendique l’action sur les réseaux sociaux et aucune rançon n’est demandée. L’outil utilisé est un kit de défiguration librement téléchargeable. Quel élément est le plus discriminant pour attribuer l’attaque à des hacktivistes plutôt qu’à des script kiddies ?", "choix": {"A": "L’absence de demande de rançon ou de gain financier", "B": "La motivation idéologique explicitement liée à une décision politique", "C": "L’utilisation d’un kit d’attaque public et automatisé", "D": "La rapidité de l’attaque après l’annonce gouvernementale", "E": "La technique de défiguration, typique des acteurs peu qualifiés"}}, {"id": 17, "module": 1, "question": "Un logiciel malveillant installé sur un terminal de paiement lit les numéros de carte directement dans la mémoire vive, au moment où ils sont traités en clair, alors que le disque et le réseau sont chiffrés. Quelles affirmations sont exactes ?", "choix": {"A": "Le chiffrement du stockage et du transport ne couvre pas cet état de l’information", "B": "L’attaque vise l’information pendant sa transmission sur le réseau", "C": "Le chiffrement du disque aurait suffi à empêcher cette attaque", "D": "L’attaque vise l’information pendant qu’elle est manipulée par le microprocesseur", "E": "Il s’agit d’une attaque d’intégrité, pas de confidentialité"}}, {"id": 18, "module": 1, "question": "Des clés USB marquées « Grille salariale 2026 – Confidentiel » sont déposées sur le parking d’une entreprise. Deux employés les branchent et un cheval de Troie s’installe. Quels éléments décrivent correctement cette attaque ?", "choix": {"A": "Il s’agit d’une attaque de la chaîne d’approvisionnement", "B": "L’attaquant exploite un ressort d’ingénierie sociale (curiosité)", "C": "Le vecteur d’attaque est le support amovible", "D": "Le vecteur d’attaque est l’accès direct, puisque l’attaquant est venu sur site", "E": "Il s’agit d’une attaque de point d’eau (watering hole)"}}, {"id": 19, "module": 1, "question": "Une bande de sauvegarde contenant la base clients est volée dans le véhicule du transporteur qui l’acheminait vers le site de secours. Du point de vue de la définition de la sécurité de l’information, dans quel état se trouvait l’information au moment du vol ?", "choix": {"A": "Transmise sur un réseau, puisqu’elle était en cours d’acheminement", "B": "Aucun de ces états, car un support physique ne relève pas de la sécurité de l’information", "C": "En cours de traitement par l’application de sauvegarde", "D": "Conservée sur un support de stockage", "E": "Manipulée par un microprocesseur"}}, {"id": 20, "module": 1, "question": "Un scanner IRM est piloté par un poste sous Windows XP que le fabricant refuse de mettre à jour ; tout changement d’OS annulerait la certification médicale. Le remplacement est prévu dans deux ans. Quelle mesure est prioritaire dans l’intervalle ?", "choix": {"A": "Isoler le poste dans un segment réseau dédié aux flux strictement nécessaires", "B": "Installer la dernière version d’un antivirus du marché compatible avec Windows XP", "C": "Débrancher définitivement le poste du réseau et transférer les images par clé USB", "D": "Migrer le poste vers un OS récent malgré la perte de certification", "E": "Appliquer les correctifs XP non officiels disponibles sur Internet"}}, {"id": 21, "module": 1, "question": "Concernant les vulnérabilités zero-day, quelles affirmations sont exactes ?", "choix": {"A": "Elles sont, par définition, découvertes par des acteurs étatiques", "B": "Elles sont considérées comme extrêmement graves", "C": "Elles peuvent être exploitées avant que l’éditeur n’en ait connaissance", "D": "Elles disparaissent dès que l’antivirus est mis à jour", "E": "Aucune signature ni aucun correctif n’existe au moment de leur exploitation initiale"}}, {"id": 22, "module": 1, "question": "Une start-up affirme que « l’ingénierie sociale est un risque purement technique qu’un bon filtre antispam suffit à neutraliser ». Quelles objections sont fondées ?", "choix": {"A": "Plusieurs techniques (talonnage, shoulder surfing, vishing) ne passent pas par la messagerie", "B": "Un filtre antispam bloque aussi les appels téléphoniques frauduleux", "C": "L’ingénierie sociale ne concerne que les grandes entreprises", "D": "L’ingénierie sociale exploite les faiblesses humaines plutôt que des failles technologiques", "E": "Un antispam rend inutile la sensibilisation des employés"}}, {"id": 23, "module": 1, "question": "L’équipe marketing partage ses fichiers de campagne avec une agence externe via des comptes de stockage cloud personnels, parce que la procédure d’achat d’une solution validée par la DSI prend trois mois. Quelle mesure traite la cause du problème plutôt que son symptôme ?", "choix": {"A": "Sanctionner les employés concernés pour non-respect de la charte", "B": "Déployer un outil de DLP pour détecter les envois de fichiers volumineux", "C": "Raccourcir le processus d’acquisition et proposer une alternative validée", "D": "Organiser une campagne de sensibilisation sur les risques du cloud", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 24, "module": 1, "question": "Des numéros de pièces d’identité dérobés dans une base sont utilisés pour ouvrir des lignes téléphoniques et des comptes de monnaie électronique au nom des victimes. Quel impact est le plus précisément décrit ?", "choix": {"A": "Exfiltration au profit d’un concurrent", "B": "Usurpation d’identité", "C": "Perte de données", "D": "Indisponibilité du système", "E": "Hoax"}}, {"id": 25, "module": 1, "question": "Sans aucune autorisation, un étudiant scanne le portail d’un établissement public, y découvre une injection SQL, extrait 10 enregistrements « pour preuve », puis écrit au responsable informatique pour l’informer, sans rien exiger. Comment qualifier son comportement ?", "choix": {"A": "Hacktivist, car il cherche avant tout à dénoncer publiquement la négligence d’un service public", "B": "Black hat, car il a extrait des données personnelles", "C": "White hat, car son intention finale, déclarée par écrit, est d’aider l’organisation", "D": "Script kiddie, car l’injection SQL est une attaque élémentaire et très documentée", "E": "Gray hat, car il agit sans autorisation mais sans intention malveillante déclarée"}}, {"id": 26, "module": 1, "question": "Des ingénieurs pétroliers d’une même région sont infectés après avoir consulté le site de leur association professionnelle, compromis la veille. Aucun courriel n’a été envoyé. Quelle technique décrit le mieux l’attaque ?", "choix": {"A": "Pharming par modification des serveurs DNS", "B": "Spear phishing ciblant les ingénieurs", "C": "Attaque de point d’eau (watering hole)", "D": "Influence campaign sur les réseaux sociaux", "E": "Typosquatting du domaine de l’association"}}, {"id": 27, "module": 1, "question": "Des milliers d’abonnés d’un opérateur reçoivent un SMS : « Votre transfert d’argent mobile de 75 000 FCFA est bloqué, confirmez sur http://mm-confirm.info ». Le lien mène à un faux formulaire demandant le code secret. Quelle qualification est la plus exacte ?", "choix": {"A": "Spim, car il s’agit d’un message instantané", "B": "Spear phishing, car le message cible les clients d’un opérateur précis", "C": "Pharming, car le lien mène vers un faux site", "D": "Smishing", "E": "Whaling, car il porte sur des montants financiers"}}, {"id": 28, "module": 1, "question": "Une société affirme : « Notre fournisseur d’hébergement a été piraté ; ce n’est donc pas notre faute et cela ne relève pas de notre gestion des risques ». Quelle notion contredit le plus directement cette affirmation ?", "choix": {"A": "La gestion des fournisseurs (vendor management)", "B": "La notion de campagne d’influence", "C": "La notion de plateforme héritée", "D": "La notion de vulnérabilité zero-day", "E": "Le principe de sécurité par l’obscurité appliqué à l’hébergeur"}}, {"id": 29, "module": 1, "question": "Lors d’une attaque, le pare-feu applicatif détecte des requêtes portant l’agent utilisateur par défaut d’un outil d’injection connu, enchaînées dans l’ordre exact du tutoriel en ligne. L’attaquant abandonne dès que le premier exploit échoue. Quel profil est le plus probable ?", "choix": {"A": "Un courtier en vulnérabilités", "B": "Un script kiddie", "C": "Un acteur étatique cherchant à se faire passer pour un amateur", "D": "Un syndicat criminel", "E": "Un hacktiviste expérimenté"}}, {"id": 30, "module": 1, "question": "Un individu se présente à l’accueil, s’exprime avec assurance en employant le jargon interne et explique qu’il doit accéder immédiatement à la baie réseau « car l’auditeur de la Banque centrale arrive dans une heure ». Quels principes psychologiques sont mobilisés ?", "choix": {"A": "Fournir une raison", "B": "Faire rire la victime", "C": "Projeter de l’assurance", "D": "Le typosquatting", "E": "L’évitement et la diversion"}}, {"id": 31, "module": 1, "question": "Un employé reçoit un courriel d’apparence interne lui demandant de « reconfigurer d’urgence son poste en désactivant le pare-feu local pour éviter un virus ». Aucune pièce jointe ni aucun lien. Parmi les qualifications suivantes, laquelle est correcte ?", "choix": {"A": "Spim", "B": "Watering hole", "C": "Typosquatting", "D": "Pharming", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 32, "module": 1, "question": "Interrogé par un agent de sécurité qui lui demande son badge, un faux technicien se plaint aussitôt de la climatisation défaillante, interroge l’agent sur sa famille, puis demande où se trouvent les toilettes. Quel principe d’ingénierie sociale illustre ce comportement ?", "choix": {"A": "Fournir une raison", "B": "Le talonnage", "C": "L’usurpation par hameçonnage", "D": "L’évitement et la diversion", "E": "Projeter de l’assurance"}}, {"id": 33, "module": 1, "question": "Un correctif de sécurité Windows est publié un mardi. Le jeudi, un code d’exploitation reconstruit à partir de l’analyse du correctif circule. L’entreprise n’applique les correctifs qu’une fois par mois et est compromise le lundi suivant. Un analyste junior qualifie l’incident de « zero-day ». Pourquoi a-t- il tort ?", "choix": {"A": "Parce qu’un zero-day doit obligatoirement être exploité le jour même où l’éditeur découvre la faille", "B": "Parce que la faille était publique et corrigée : c’est le délai d’application qui a été exploité", "C": "Parce que l’exploit a été reconstruit, ce qui en fait une attaque de la chaîne d’approvisionnement", "D": "Parce que le zero-day suppose l’intervention d’un acteur étatique", "E": "Parce qu’un zero-day ne peut concerner que des logiciels libres"}}, {"id": 34, "module": 1, "question": "Un faux recruteur, avec un profil professionnel crédible sur un réseau social, contacte une ingénieure réseau et lui envoie une « fiche de poste » piégée par messagerie privée. Quel vecteur d’attaque a été utilisé pour l’approche initiale ?", "choix": {"A": "La chaîne d’approvisionnement", "B": "L’accès direct", "C": "Les réseaux sociaux", "D": "Le courrier électronique", "E": "Le support amovible"}}, {"id": 35, "module": 1, "question": "Des attaquants ont compromis le compte VPN d’un prestataire de maintenance de la climatisation, puis ont rebondi vers les serveurs de caisse d’une chaîne de supermarchés. Quel principe ce cas illustre-t-il le mieux ?", "choix": {"A": "Le danger des configurations par défaut sur les équipements de climatisation", "B": "L’absence de correctifs pour les logiciels applicatifs de caisse", "C": "Le risque de shadow IT introduit par le service de maintenance", "D": "La vulnérabilité des plateformes héritées (legacy) en environnement commercial", "E": "Le maillon le plus faible propre à l’intégration système avec un tiers"}}, {"id": 36, "module": 1, "question": "Une entreprise migre ses serveurs on-premise vers le cloud en supposant que « le fournisseur gère désormais toute la sécurité ». Quelle affirmation corrige cette erreur d’analyse ?", "choix": {"A": "Le cloud supprime les risques liés aux tiers puisque tout est centralisé", "B": "Le client reste responsable de la configuration de ses propres ressources cloud", "C": "Une plateforme cloud est par nature exempte de vulnérabilités", "D": "Le fournisseur cloud prend en charge la totalité des configurations clientes", "E": "Seules les plateformes on-premise peuvent souffrir de configurations faibles"}}, {"id": 37, "module": 1, "question": "Un parc de 600 caméras IP présente une faille connue depuis 18 mois. Le correctif existe, mais il doit être flashé manuellement caméra par caméra avec une interruption de service. Quelle catégorie de vulnérabilité décrit le mieux la situation ?", "choix": {"A": "Vulnérabilité de tiers, puisque le fabricant des caméras est un acteur externe", "B": "Plateforme héritée, puisque les caméras ont été installées il y a plus d’un an", "C": "Zero-day, puisque la faille est toujours exploitable", "D": "Vulnérabilité liée aux correctifs : difficulté de patcher le firmware", "E": "Configuration faible, puisque les caméras sont mal paramétrées depuis leur installation"}}, {"id": 38, "module": 1, "question": "Concernant les acteurs de la menace, quelles affirmations sont exactes ?", "choix": {"A": "Les attaques internes sont plus difficiles à repérer car elles proviennent de l’intérieur de l’organisation", "B": "Les APT sont le plus souvent associées aux acteurs étatiques", "C": "Les courtiers vendent leur connaissance d’une faille au plus offrant", "D": "Les script kiddies sont inoffensifs puisqu’ils ne maîtrisent pas les outils utilisés", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 39, "module": 1, "question": "En une semaine, des centaines de comptes récemment créés publient des messages quasi identiques accusant un service d’argent mobile de « bloquer les fonds des clients ». Les messages renvoient vers des articles d’apparence journalistique. Quelle qualification est la plus adaptée ?", "choix": {"A": "Une attaque de type watering hole", "B": "Une vague de spim", "C": "Un hoax technique", "D": "Une attaque de pharming", "E": "Une campagne d’influence"}}, {"id": 40, "module": 1, "question": "Plusieurs utilisateurs saisissent correctement l’adresse de leur banque dans le navigateur, mais arrivent sur une copie parfaite du site. Aucun lien cliqué, aucune faute de frappe. Quelle technique est la plus probable ?", "choix": {"A": "Spear phishing", "B": "Hoax", "C": "Watering hole", "D": "Pharming", "E": "Typosquatting"}}, {"id": 41, "module": 1, "question": "Un attaquant obtient des informations sensibles en observant, depuis la file d’attente, un employé qui saisit le code du digicode d’une salle d’archives. Quelle contre-mesure est la plus directement adaptée ?", "choix": {"A": "Déployer un filtre antispam sur la messagerie", "B": "Imposer un changement mensuel du code d’accès à tous les agents", "C": "Masquer le clavier et éloigner la file d’attente du digicode", "D": "Installer un sas (mantrap) à l’entrée de la salle d’archives", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 42, "module": 1, "question": "Après le démantèlement d’un centre d’appels frauduleux, les enquêteurs constatent que les opérateurs arrêtés ne connaissaient pas les commanditaires. Ces derniers, peu nombreux et expérimentés, finançaient l’infrastructure, recrutaient les exécutants et prélevaient une commission sans jamais participer directement aux fraudes. Quel type d’acteur décrit le mieux les commanditaires ?", "choix": {"A": "Un syndicat criminel organisé de façon entrepreneuriale", "B": "Des script kiddies coordonnés par un forum", "C": "Des courtiers en vulnérabilités", "D": "Des initiés infiltrés dans les opérateurs télécoms", "E": "Des hacktivistes agissant par conviction"}}, {"id": 43, "module": 1, "question": "Un filtre antispam fondé sur l’analyse des mots du message laisse passer une vague de courriels publicitaires frauduleux. Chaque message ne contient qu’une image de l’annonce et aucun texte. Comment qualifier ce résultat et sa cause ?", "choix": {"A": "Un faux positif, car le filtre a correctement classé des messages légitimes", "B": "Un vrai négatif, car une image ne peut pas contenir de contenu malveillant", "C": "Un faux positif dû à la taille excessive des pièces jointes", "D": "Un faux négatif dû à une base de mots-clés obsolète qu’il suffit de mettre à jour", "E": "Un faux négatif dû au fait que le contenu image échappe au filtrage textuel"}}, {"id": 44, "module": 1, "question": "Trois semaines avant de rejoindre un concurrent, un administrateur de bases de données exporte la liste complète des clients « pour garder une trace de son travail » et la copie sur une clé USB personnelle. La base de production n’est ni modifiée ni supprimée. Quelles qualifications sont correctes ?", "choix": {"A": "L’impact principal est une exfiltration de données", "B": "Il s’agit d’une menace interne (insider)", "C": "Il s’agit d’un cas de shadow IT", "D": "L’impact principal est une perte de données (data loss)", "E": "L’impact principal est une usurpation d’identité"}}, {"id": 45, "module": 1, "question": "Un attaquant inscrit un domaine quasi identique à celui d’un fournisseur et y place uniquement des bannières publicitaires. Un junior conclut à une attaque de pharming. Quelle est l’erreur d’analyse ?", "choix": {"A": "Il n’y a pas d’erreur : un domaine ressemblant à un domaine légitime relève toujours du pharming", "B": "Le pharming exige que le site contienne un formulaire de connexion", "C": "Le pharming manipule la résolution d’adresse ; ici, seule une faute de frappe est exploitée", "D": "Le pharming ne fonctionne qu’avec des SMS", "E": "Le pharming exige l’envoi préalable d’un courriel ciblé"}}, {"id": 46, "module": 1, "question": "Une entreprise remarque qu’un site rempli de publicités capte du trafic : son nom de domaine ne diffère du domaine officiel que par l’inversion de deux lettres. Aucun formulaire de saisie n’y est présent. Quel est l’objectif le plus probable de l’attaquant ?", "choix": {"A": "Préparer une attaque de type watering hole visant les employés de l’entreprise", "B": "Voler les identifiants des clients au moyen d’un faux formulaire de connexion", "C": "Empoisonner le cache DNS des fournisseurs d’accès", "D": "Monétiser le trafic des internautes qui commettent une faute de frappe", "E": "Diffuser un hoax sur une fausse faille de sécurité"}}, {"id": 47, "module": 1, "question": "Un chercheur découvre une faille dans l’application mobile d’une banque. Au lieu de la signaler à l’éditeur, il la met aux enchères sur un forum privé ; un groupe criminel l’achète et l’exploite avant que l’éditeur n’en ait connaissance. Quelles affirmations sont exactes ?", "choix": {"A": "Le chercheur est un hacker « white hat » puisqu’il n’a pas exploité la faille lui-même", "B": "Le chercheur agit en tant que courtier (broker) de vulnérabilités", "C": "Pour la banque, la faille exploitée constitue une vulnérabilité zero-day", "D": "Le groupe criminel acheteur est par définition un acteur étatique", "E": "La faille relève de la catégorie « patches » car l’éditeur tarde à corriger"}}, {"id": 48, "module": 1, "question": "Une enquête révèle qu’un logiciel malveillant développé sur mesure est présent depuis 26 mois sur les postes d’une direction chargée de négociations commerciales internationales. L’exfiltration se fait par petits volumes, uniquement la nuit, et aucune tentative de revente des données n’a été détectée. Quel profil d’acteur est le plus cohérent avec ces indices ?", "choix": {"A": "Un initié mécontent agissant depuis l’intérieur du réseau", "B": "Un courtier (broker) préparant discrètement la revente d’une vulnérabilité", "C": "Un syndicat criminel cherchant à monétiser les données à long terme", "D": "Un concurrent cherchant un avantage décisif sur un appel d’offres ponctuel", "E": "Un acteur étatique conduisant une campagne d’intrusion de type APT"}}, {"id": 49, "module": 1, "question": "Le directeur financier reçoit un courriel qui cite le nom du commissaire aux comptes, la date réelle de clôture et un projet d’acquisition non public ; il lui est demandé de valider un virement urgent. Quelle est la qualification la plus précise ?", "choix": {"A": "Whaling", "B": "Spim", "C": "Hoax", "D": "Hameçonnage (phishing) de masse", "E": "Vishing, car un appel de confirmation est prévu"}}, {"id": 50, "module": 1, "question": "Un groupe sans lien établi avec un État pénètre le système de supervision d’un réseau électrique régional, provoque des coupures en série en pleine saison chaude et diffuse des messages annonçant « d’autres coupures à venir ». Aucun vol de données n’est constaté. Quelle qualification est la plus pertinente ?", "choix": {"A": "Syndicat criminel, car l’attaque vise à préparer une extorsion", "B": "Concurrent, car un autre fournisseur d’électricité pourrait en profiter", "C": "Acteur étatique, car la cible est une infrastructure critique nationale", "D": "Cyberterroristes, car l’objectif est la perturbation et la panique", "E": "Hacktivistes, car le groupe communique publiquement"}}, {"id": 51, "module": 1, "question": "Une organisation dispose de pare-feu récents, de serveurs à jour et d’un antivirus centralisé, mais un attaquant obtient un accès VPN en se faisant passer au téléphone pour un directeur en déplacement. Dans le modèle en couches de la sécurité de l’information, quelle couche a cédé ?", "choix": {"A": "La couche réseau du modèle OSI", "B": "Les produits, car le VPN aurait dû bloquer l’attaquant", "C": "Le matériel physique de l’organisation", "D": "La cryptographie du tunnel VPN", "E": "Les personnes"}}, {"id": 52, "module": 1, "question": "Quelle affirmation sur la relation entre violation de données (data breach) et exfiltration est exacte ?", "choix": {"A": "L’exfiltration et la violation de données sont deux termes strictement équivalents dans tous les cas", "B": "La violation de données concerne uniquement les données de carte bancaire", "C": "L’exfiltration est un type de violation, mais toute violation n’implique pas une exfiltration", "D": "L’exfiltration ne concerne que les données détruites après leur vol", "E": "Toute violation de données implique nécessairement une exfiltration"}}, {"id": 53, "module": 1, "question": "Des liens frauduleux vers un faux portail RH sont diffusés aux employés par l’application de messagerie instantanée interne, et non par courriel. La passerelle antispam de messagerie ne remonte aucune alerte. Quelles affirmations sont exactes ?", "choix": {"A": "Il s’agit de spim", "B": "L’absence d’alerte de la passerelle antispam ne prouve pas l’absence d’attaque", "C": "Il s’agit de typosquatting, puisque le portail est faux", "D": "Il s’agit d’un hoax, puisqu’aucune pièce jointe n’est envoyée", "E": "La passerelle antispam est défaillante et produit des faux positifs"}}, {"id": 54, "module": 1, "question": "Un fichier contenant les dossiers de 80 000 assurés est retrouvé en accès public sur un service de stockage d’un grand fournisseur cloud. Le fournisseur n’a subi aucune intrusion. Dans quelle catégorie de vulnérabilité ce cas se range-t-il principalement ?", "choix": {"A": "Vulnérabilité zero-day dans l’interface du fournisseur", "B": "Vulnérabilité de tiers liée à l’intégration système", "C": "Vulnérabilité de plateforme cloud, imputable au fournisseur", "D": "Configuration faible (permissions ouvertes) côté client", "E": "Vulnérabilité liée aux retards d’application des correctifs"}}, {"id": 55, "module": 1, "question": "Un point d’accès Wi-Fi non autorisé, portant le nom du réseau invité de l’entreprise, est découvert dans le hall d’accueil. Plusieurs ordinateurs portables s’y sont connectés. Quel vecteur d’attaque est concerné ?", "choix": {"A": "Le cloud", "B": "La chaîne d’approvisionnement", "C": "Le sans-fil (wireless)", "D": "Les réseaux sociaux", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 56, "module": 1, "question": "Pour un hôpital, quelle propriété de la triade CIA est la plus directement menacée par une attaque qui rend le dossier patient inaccessible pendant une garde de nuit, sans fuite ni altération des données ?", "choix": {"A": "La confidentialité", "B": "La disponibilité", "C": "L’authenticité", "D": "La non-répudiation", "E": "L’intégrité"}}, {"id": 57, "module": 1, "q dispensable au succès de cette stratégie ?", "choix": {"A": "Un certificat numérique à validation étendue", "B": "Un filtre antispam bloquant les pièces jointes", "C": "Une politique de mots de passe renforcée", "D": "Un antivirus mis à jour sur les postes infectés", "E": "Des sauvegardes inaccessibles au malware et testées"}}, {"id": 125, "module": 4, "question": "Quelle limite principale de l’analyse statique (par signatures) un responsable sécurité doit-il garder à l’esprit ?", "choix": {"A": "Elle nécessite une connexion réseau permanente", "B": "Elle ne peut pas analyser les fichiers compressés", "C": "Elle ne détecte que ce qui correspond à des signatures connues", "D": "Elle ne fonctionne que sur les serveurs", "E": "Elle génère systématiquement plus de faux positifs que l’heuristique"}}, {"id": 126, "module": 4, "question": "Un logiciel malveillant tente de désactiver l’antivirus intégré de Windows en modifiant directement le registre. Quelle fonctionnalité est conçue pour empêcher précisément ce type de modification ?", "choix": {"A": "La protection anti-falsification", "B": "Le filtrage bayésien des modifications", "C": "L’analyse statique du code de l’antivirus", "D": "Le démarrage legacy avec mot de passe BIOS", "E": "Le pop-up blocker"}}, {"id": 127, "module": 4, "question": "Un antivirus détecte un fichier suspect dans le répertoire de téléchargement et le déplace dans une zone protégée où il ne peut plus s’exécuter, en attendant une analyse. Quelle mesure a été appliquée ?", "choix": {"A": "La liste d’autorisation", "B": "Le durcissement par modèle de sécurité", "C": "La suppression définitive", "D": "La mise en quarantaine", "E": "Le sandboxing"}}, {"id": 128, "module": 4, "question": "Un outil envoie des milliers d’entrées aléatoires ou malformées à un programme compilé pour provoquer des exceptions et des plantages. Quelles affirmations sont exactes ?", "choix": {"A": "Il s’agit d’une revue manuelle par les pairs", "B": "Cette technique relève de l uilibreur de charge, utile pour répartir les requêtes", "B": "Un moniteur d’intégrité, utile contre les malwares et pour la conformité", "C": "Un TAP, utile pour copier le trafic", "D": "Un DLP, utile pour bloquer les envois de données sensibles hors de l’organisation", "E": "Un NAC, utile pour contrôler l’état des postes"}}, {"id": 467, "module": 9, "question": "Un système de détection signale à l’utilisateur qu’un programme tente de modifier les paramètres de démarrage et lui demande s’il souhaite autoriser l’action. Quelle méthode de surveillance est utilisée ?", "choix": {"A": "La surveillance par signature", "B": "La surveillance par proxy", "C": "La surveillance comportementale", "D": "La surveillance par TAP", "E": "Aucune des propositions ci-dessus n’est exacte."}}, {"id": 468, "module": 9, "question": "Quelles actions un serveur DLP peut-il déclencher lorsqu’une violation de politique est signalée par un agent ?", "choix": {"A": "Bloquer les données ou les mettre en quarantaine", "B": "Révoquer le certificat racine de l’organisation", "C": "Chiffrer définitivement le poste de l’utilisateur", "D": "Désactiver le protocole STP", "E": "Rediriger la demande vers une personne habilitée à l’examiner"}}, {"id": 469, "module": 9, "question": "Une entreprise oblige tous les postes internes à passer par un serveur intermédiaire pour accéder à Internet ; ce serveur analyse les téléchargements et masque les adresses internes. Quel équipement est décrit ?", "choix": {"A": "Un serveur de rebond (jump box)", "B": "Un proxy inverse (reverse proxy)", "C": "Un pot de miel", "D": "Un proxy direct (forward proxy)", "E": "Un gouffre (sinkhole)"}}, {"id": 470, "module": 9, "question": "Une équipe de recherche veut observer en détail les commandes et outils utilisés par les attaquants, sur un système qui simule un environnement complet. Quel type de pot de miel est adapté, et quel risque faut-il maîtriser ?", "choix": {"A": "Un TAP réseau, avec le risque de couper la liaison", "B": "Un pot de miel à faible interaction, avec le risque de ne rien apprendre d’utile", "C": "Un pot de miel à forte interaction, avec un risque de rebond s’il est mal isolé", "D": "Un proxy inverse, avec le risque de saturer le serveur web exposé aux attaquants", "E": "Un gouffre (sinkhole), avec le risque de perdre le trafic légitime"}}, {"id": 471, "module": 9, "question": "Une nouvelle variante d’un malware connu, légèrement modifiée, traverse le réseau sans déclencher l’IDS à signatures. Comment qualifier ce résultat ?", "choix": {"A": "Un faux positif", "B": "Un faux négatif", "C": "Un vrai négatif", "D": "Une anomalie de référence", "E": "Un vrai positif"}}, {"id": 472, "module": 9, "question": "Un pare-feu laisse entrer une réponse HTTP uniquement parce qu’elle correspond à une connexion initiée depuis l’intérieur et suivie dans sa table de sessions. Un autre pare-feu examine chaque paquet isolément, selon ses seules règles. Quelle paire de qualifications est correcte ?", "choix": {"A": "Les deux sont des pare-feu applicatifs web", "B": "Le premier est sans état (stateless), le second est à états (stateful)", "C": "Les deux sont des passerelles NAT", "D": "Le premier est un proxy inverse, le second un proxy direct filtrant", "E": "Le premier est à états (stateful), le second est sans état (stateless)"}}, {"id": 473, "module": 9, "question": "Une banque installe un serveur volontairement peu protégé, isolé et sans données réelles, afin d’attirer les attaquants et d’étudier leurs méthodes. Quels objectifs poursuit-elle ?", "choix": {"A": "Chiffrer les données de production", "B": "Accélérer le trafic légitime vers les serveurs de production", "C": "Découvrir les techniques employées par les attaquants", "D": "Détourner les attaquants des actifs réels", "E": "Remplacer le pare-feu périmétrique"}}, {"id": 474, "module": 9, "question": "Une organisation utilise son contrôleur de domaine Active Directory pour examiner l’état des postes qui se connectent, sans agent
